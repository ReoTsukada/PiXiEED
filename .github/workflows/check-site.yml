name: Check site
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PIXIEED_CHROME_EXECUTABLE: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install build dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test site
        run: npm test
      - name: Build site
        run: npm run build -- --output /tmp/pixieed-site-check
      - name: Install pinned browser harness
        run: npm install --prefix /tmp/pixieed-browser --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Verify output conversions in a real browser
        env:
          PIXIEED_PLAYWRIGHT_MODULE: /tmp/pixieed-browser/node_modules/playwright/index.mjs
          PIXIEED_BROWSER_ROOT: /tmp/pixieed-site-check
          PIXIEED_BROWSER_ARTIFACTS: /tmp/pixieed-output-browser
        run: |
          status=0
          node scripts/output-integration-browser-harness.mjs || status=1
          node scripts/conversion-discovery-browser-harness.mjs || status=1
          PIXIEED_BROWSER_ARTIFACTS=/tmp/pixieed-output-browser/workspace node scripts/conversion-workspace-browser-harness.mjs || status=1
          exit "$status"
      - name: Verify creation controls and saved-work entry
        env:
          PIXIEED_PLAYWRIGHT_MODULE: /tmp/pixieed-browser/node_modules/playwright/index.mjs
          PIXIEED_BROWSER_BASE_URL: http://127.0.0.1:4189
          PIXIEED_CONTROLS_OUTPUT: /tmp/pixieed-creation-browser/controls
          PIXIEED_DRAW_ENTRY_OUTPUT: /tmp/pixieed-creation-browser/entry
          PIXIEED_RESUME_OUTPUT: /tmp/pixieed-creation-browser/resume
          PIXIEED_TOUCH_OUTPUT: /tmp/pixieed-creation-browser/touch
          PIXIEED_GALLERY_BASE_URL: http://127.0.0.1:4189
          PIXIEED_GALLERY_OUTPUT: /tmp/pixieed-creation-browser/gallery
        run: |
          python3 -m http.server 4189 --bind 127.0.0.1 --directory /tmp/pixieed-site-check > /tmp/pixieed-creation-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node --input-type=module -e "for (let i = 0; i < 30; i++) { try { if ((await fetch('http://127.0.0.1:4189/draw/')).ok) process.exit(0); } catch {} await new Promise(r => setTimeout(r, 200)); } process.exit(1);"
          status=0
          node scripts/creation-controls-browser-harness.mjs || status=1
          node scripts/draw-touch-browser-harness.mjs || status=1
          node scripts/draw-touch-lifecycle-browser-harness.mjs || status=1
          node scripts/draw-entry-browser-harness.mjs || status=1
          node scripts/direct-resume-browser-harness.mjs || status=1
          node scripts/gallery-first-browser-harness.mjs || status=1
          exit "$status"
      - name: Verify progressive social loading and actions
        env:
          PIXIEED_PLAYWRIGHT_MODULE: /tmp/pixieed-browser/node_modules/playwright/index.mjs
          PIXIEED_SNS_AFTER: /tmp/pixieed-site-check
          PIXIEED_SNS_SKIP_BENCH: '1'
          PIXIEED_SNS_REPORT: /tmp/pixieed-social-browser
        run: node scripts/social-loading-browser-harness.mjs
      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-browser-verification
          # Keep functional reports; preview/test screenshots must stay off uploads.
          path: |
            /tmp/pixieed-output-browser/**/*.json
            /tmp/pixieed-social-browser/**/*.json
            /tmp/pixieed-creation-browser/**/*.json
          if-no-files-found: ignore
          retention-days: 7
