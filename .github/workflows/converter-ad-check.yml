name: Manual converter ad diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/converter-ad-check.yml'
      - 'scripts/check-converter-ad-delivery.mjs'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-ad-check]')
    runs-on: macos-15
    timeout-minutes: 4
    env:
      PIXIEED_CHROME_EXECUTABLE: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Single read-only page visit, no ad clicks or reloads
        run: node scripts/check-converter-ad-delivery.mjs --once
