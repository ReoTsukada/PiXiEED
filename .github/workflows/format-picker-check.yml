name: Converter format picker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'js/creation/format-picker.mjs'
      - 'css/format-picker.css'
      - 'js/creation/conversion-entry.mjs'
      - 'tests/format-picker.test.mjs'
      - 'scripts/check-format-picker.mjs'
      - '.github/workflows/format-picker-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      PIXIEED_CHROME_EXECUTABLE: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Search, descriptions and capability tests
        run: node --test tests/format-picker.test.mjs
      - name: Real converter and picker, localhost only
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p='scripts/check-text-art-fit.mjs';
          let s=fs.readFileSync(p,'utf8');
          const from="throw Error('Timeout '+label+': '+await evaluate(()=>document.querySelector('[data-tx-status]')?.textContent))";
          const to="throw Error('Timeout '+label+': '+JSON.stringify({errors,dom:await evaluate(()=>({url:location.href,editor:document.querySelector('[data-editor]')?.outerHTML.slice(0,200),native:document.querySelector('[data-format]')?.outerHTML,shared:document.querySelector('[data-sc-format]')?.outerHTML,status:document.querySelector('[data-status]')?.textContent,mode:document.querySelector('.text-mode-nav [aria-pressed=true]')?.dataset.textMode,dialog:document.querySelector('dialog')?.open,demoDisabled:document.querySelector('[data-demo]')?.disabled}))}))";
          if(!s.includes(from))throw Error('Diagnostic anchor changed');
          s=s.replace(from,to).replace('assert.ok(value,name);checks.push(name);','assert.ok(value,name);checks.push(name);console.log("PASS",name);');
          fs.writeFileSync(p,s);
          JS
          node scripts/check-format-picker.mjs
