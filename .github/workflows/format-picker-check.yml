name: Converter format picker
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'js/creation/format-picker.mjs'
      - 'css/format-picker.css'
      - 'js/creation/conversion-entry.mjs'
      - 'js/creation/output-page.mjs'
      - 'js/creation/output-receive.mjs'
      - 'output/work/index.html'
      - 'js/creation/conversion-unified-input.mjs'
      - 'js/creation/conversion-output-destination.mjs'
      - 'tests/format-picker.test.mjs'
      - 'scripts/check-format-picker.mjs'
      - '.github/workflows/format-picker-check.yml'
  push:
    branches: [main]
    paths:
      - 'js/creation/format-picker.mjs'
      - 'css/format-picker.css'
      - 'js/creation/conversion-entry.mjs'
      - 'js/creation/output-page.mjs'
      - 'js/creation/output-receive.mjs'
      - 'output/work/index.html'
      - 'js/creation/conversion-unified-input.mjs'
      - 'js/creation/conversion-output-destination.mjs'
      - 'tests/format-picker.test.mjs'
      - 'scripts/check-format-picker.mjs'
      - '.github/workflows/format-picker-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      PIXIEED_CHROME_EXECUTABLE: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Search, descriptions and capability tests
        run: node --test tests/format-picker.test.mjs
      - name: Install pinned build dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the shipped workspace
        run: npm run build -- --output /tmp/pixieed-format-picker-site
      - name: Install pinned browser harness
        run: npm install --prefix /tmp/pixieed-browser --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Visible output selection and isolated optional picker
        env:
          PIXIEED_PLAYWRIGHT_MODULE: /tmp/pixieed-browser/node_modules/playwright/index.mjs
          PIXIEED_BROWSER_ROOT: /tmp/pixieed-format-picker-site
          PIXIEED_BROWSER_ARTIFACTS: /tmp/pixieed-format-picker-browser
        run: node scripts/check-format-picker.mjs
      - name: Retain functional report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-selection-verification
          path: /tmp/pixieed-format-picker-browser/report.json
          if-no-files-found: ignore
          retention-days: 7
