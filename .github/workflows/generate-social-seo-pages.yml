name: Generate social SEO pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-seo-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      - name: Verify npm version
        run: test "$(npm --version)" = "10.9.3"

      - name: Generate published image-post pages
        run: node scripts/generate-social-seo-pages.mjs

      - name: Verify generated social pages
        run: |
          node scripts/test-social-seo-pages.mjs
          git diff --check

      - name: Commit only generated social SEO files
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- posts sitemap.xml)" ]; then
            echo "No published social changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts sitemap.xml
          git commit -m "Generate social SEO pages"
          git push origin HEAD:main
