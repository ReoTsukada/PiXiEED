name: Text art fit and native pixels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/text-art-fit-check.yml'
      - 'js/creation/text-art-viewer.mjs'
      - 'js/creation/text-pixel-origin.mjs'
      - 'js/creation/text-tools.mjs'
      - 'css/text-art-viewer.css'
      - 'scripts/check-text-art-fit.mjs'
      - 'tests/text-art-fit.test.mjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      PIXIEED_CHROME_EXECUTABLE: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact-pixel and preview geometry unit tests
        run: node --test tests/text-art-fit.test.mjs
      - name: Real converter on localhost with external traffic blocked
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='scripts/check-text-art-fit.mjs';
          let source=fs.readFileSync(path,'utf8');
          source=source.replace("await send('Fetch.enable'", "await send('Page.bringToFront');\n await send('Fetch.enable'");
          source=source.replace('const ready=async()=>', 'const paint=async()=>evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));\n const ready=async()=>');
          source=source.replaceAll('await delay(120)','await paint()').replaceAll('await delay(160)','await paint()').replaceAll('await delay(80)','await paint()');
          source=source.replace('return {mode:h.dataset.viewMode', 'return {view:a.toJSON(),art:b.toJSON(),natural:[p.offsetWidth,p.offsetHeight],client:[v.clientWidth,v.clientHeight],scroll:[v.scrollLeft,v.scrollTop,v.scrollHeight],preStyle:p.style.cssText,visibility:document.visibilityState,surface:[p.parentElement.style.cssText,p.parentElement.getBoundingClientRect().toJSON()],documentWidth:document.documentElement.scrollWidth,windowWidth:innerWidth,mode:h.dataset.viewMode');
          source=source.replace('const g=await geometry();check(', 'const g=await geometry();console.log("FIT_GEOMETRY",JSON.stringify(g));check(');
          fs.writeFileSync(path,source);
          JS
          node scripts/check-text-art-fit.mjs
