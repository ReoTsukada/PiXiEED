native_policy:
  - Browser/PWA is the first delivery and remains the fallback.
  - NATIVE-500 defines one host boundary; canonical Core/project state never forks by shell.
  - Desktop distribution is a candidate only; signing, macOS notarization, auto-update, rollback, file association, offline, and security evidence are mandatory.
  - Tauri/Electron are not selected before an ADR comparison.
  - Mobile uses app-shell/pixieed-capacitor for Google Play/App Store evaluation; Play internal/closed and TestFlight are staged evidence only.
  - Store submission and deploy are prohibited.

non_negotiable:
  - current Market, PiXiSYNC, URLs, data, and production fallback remain usable
  - isolated or copied fixtures are never reported as production proof
  - every package has bounded writes, acceptance evidence, and independent review
  - completion never starts the next package automatically
  - WP-990 records a decision request only; CUT-001 remains blocked until explicit Owner authorization
