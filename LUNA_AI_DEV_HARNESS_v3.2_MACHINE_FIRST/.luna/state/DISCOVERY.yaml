raw_goal: "PiXiEEDを、Draw2・Audio・Game・PiXYNC・マーケット・マイページ・SNSを共通の高性能UI/UXとデータ基盤で統合し、WebとiOS/Androidアプリの両方で使えるクリエイティブプラットフォームとして再構築する。既存マーケット商品と購入権限は維持し、人気・高評価の現行クリエイティブアプリから検証可能な設計原則を取り入れる。"
confirmed_facts:
  - "公開順はWeb版を先行し、同じApp Shellを使ってiOS/Android版を段階公開する。"
  - "アプリ内マーケットは最終的にデジタル商品の購入まで対応する。"
  - "iOSはStoreKit、AndroidはGoogle Play Billingを使用し、Web決済とはアダプターを分離する。"
  - "PiXiEED.jpのトップページはPiXiEEDraw2を検索・理解・利用開始するための入口にする。"
