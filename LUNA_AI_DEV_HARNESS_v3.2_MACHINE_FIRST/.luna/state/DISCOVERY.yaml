  - "Draw2を制作体験の主役とし、AudioとGameは同じApp Shell内で必要時に遅延ロードする。"
  - "グローバルナビゲーションは制作、マーケット、ライブラリ、コミュニティ、マイページを基本候補とする。"
  - "アプリ内デジタル販売は、初期の閲覧・購入済み利用と分離して段階実装する。"
