      - "SEO/AIEOの技術要件調査"
      - "共通App Shellの現行資産確認"
    completion_criteria:
      - "既存トップページの主要導線とメタ情報を棚卸しできている"
      - "PiXiEEDraw2中心の見出し、説明、機能、開始CTA、既存サービス導線が実装されている"
      - "canonical、OG、JSON-LD、見出し階層、内部リンクが検証できる"
      - "主要デスクトップ幅と狭いWeb幅でレイアウト崩れがない"
