<body data-tool-name="絵を描いて音楽を作る" data-tool-short="音楽" data-page="audio" class="app-page app-page--tool-audio audio-tool-body creation-editor">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/" aria-label="PiXiEED ホーム"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a></div></header>
  <main id="main" class="audio-page">
    <h1 class="creation-editor__title">絵を描いて音楽を作る</h1>
    <p id="audio-status" class="audio-status" role="status" aria-live="polite">1マスに1音。色を選んで描けます。</p>
    <section class="audio-workspace" aria-label="曲の編集">
      <div id="audio-grid-wrap" class="audio-grid-wrap creation-editor__stage" aria-label="音楽ピクセルキャンバス">
        <canvas id="audio-pixel-canvas" class="audio-pixel-canvas" width="16" height="16" tabindex="0" role="img" aria-label="共有画像のセルを音に割り当てる音楽キャンバス。矢印キーで移動し、EnterまたはSpaceで音を描画します。" aria-describedby="audio-status"></canvas>
        <div id="audio-cursor" class="audio-cursor" aria-hidden="true" hidden></div>
        <div id="audio-playhead" class="audio-playhead" aria-hidden="true" hidden></div>
      </div>
      <div class="audio-controls creation-editor__controls">
        <div class="audio-control-row creation-editor__palette">
          <button id="audio-current" class="audio-current" type="button" aria-label="選択中の色を調整" aria-expanded="false" aria-controls="audio-color-editor-panel"><span class="audio-current__swatch" aria-hidden="true"></span></button>
          <div id="audio-tracks" class="audio-tracks" role="group" aria-label="描く色を選ぶ"></div>
        </div>
        <div class="audio-toolbar" role="group" aria-label="操作">
          <div class="audio-tools creation-editor__tools-row" role="group" aria-label="描く・戻す・やり直す">
            <button id="audio-tool-pen" type="button" data-drawing-icon="pen" aria-pressed="true" aria-label="ペン"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg></button>
            <button id="audio-tool-eraser" type="button" data-drawing-icon="eraser" aria-pressed="false" aria-label="消しゴム"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h11"/><path d="M4 15l9-9 6 6-7 7H8z"/><path d="M9 10l6 6"/></svg></button>
            <button id="audio-undo" type="button" disabled aria-disabled="true" aria-label="ひとつ戻す" title="戻す（Ctrl / ⌘ Z）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 4 9l5 5M4 9h9a6 6 0 0 1 0 12h-2"/></svg></button>
            <button id="audio-redo" type="button" disabled aria-disabled="true" aria-label="やり直す" title="やり直す（Ctrl / ⌘ Shift Z）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 5 5-5 5M20 9h-9a6 6 0 0 0 0 12h2"/></svg></button>
            <details id="audio-palette-settings" class="audio-popover audio-palette-settings"><summary hidden aria-hidden="true" tabindex="-1"><img src="/assets/icons/instruments/music-settings.svg" alt="" aria-hidden="true"/></summary><div class="audio-popover-body audio-palette-settings__body"><button id="audio-palette-close" class="audio-palette-close" type="button" aria-label="色と音色の設定を閉じる">×</button><div class="audio-palette-editor__current"><span id="audio-edit-color-swatch" aria-hidden="true"></span><strong id="audio-edit-color-name"></strong></div><div class="audio-palette-editor__tabs" role="group" aria-label="色と音色の設定"><button type="button" data-audio-editor-view="color" aria-pressed="true">色</button><button type="button" data-audio-editor-view="sound" aria-pressed="false">音色</button></div><section id="audio-sound-editor-panel" class="audio-sound-editor" aria-label="音を設定" hidden><p id="audio-slot-share-note" class="audio-instrument-legend"></p><div class="audio-sound-assign"><button id="audio-sound-unassign" class="audio-sound-unassign" type="button" aria-label="この色の音を外す" title="音を外す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/></svg></button><div id="audio-sound-slots" class="audio-sound-slots" role="group" aria-label="4つの音色レーン"></div></div><div id="audio-instrument-groups" class="audio-instrument-groups"><div id="audio-instrument-group-tabs" class="audio-instrument-group-tabs" role="group" aria-label="音色の種類"></div><p id="audio-drum-note" class="audio-instrument-legend" hidden>高さによらず同じ音で鳴ります。横に続けると毎マス打ち直し、同じ色の同じ列は1打になります。</p><div id="audio-instrument-choices" class="audio-instrument-choices" role="group" aria-label="音色を選ぶ"></div></div></section></div></details>

            <span data-pass-slot hidden></span>
          </div>
          <div class="audio-header-actions creation-editor__actions" role="group" aria-label="フレームとファイル">
            <div id="audio-animation-panel" hidden><div id="audio-animation-controls"></div></div>
            <details id="audio-output" class="creation-output"><summary aria-label="出力と保存" title="出力"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg></summary><div class="creation-output__panel"><h2>出力</h2><p>画像・音声・動画の形式や名前を選べます。</p><button id="audio-take-photo" class="creation-output__card audio-output__camera" type="button" aria-label="写真を撮って音楽にする" title="写真から音楽"><img src="/assets/icons/pixieed/camera.svg" alt="" aria-hidden="true"/><strong>写真から音楽にする</strong><small>カメラで撮影した画像を使う</small></button><button id="audio-export-image" type="button" class="creation-output__card"><strong>出力を開く</strong><small>画像・WAV音声・対応動画を選択</small></button><div class="creation-output__divider"></div><button id="audio-save" type="button" class="creation-output__card"><strong>この作品を保存</strong><small>曲と絵をこの端末に保存</small></button><button type="button" class="creation-output__card" data-output-project><strong>作品を管理</strong><small>名前・保存・読み込み</small></button></div></details>
            <details id="audio-composition-settings" class="audio-popover audio-composition-settings"><summary aria-label="テンポとキャンバスを設定" title="テンポとキャンバスを設定"><span id="audio-size-chip" class="audio-size-chip" aria-hidden="true">16</span></summary><div class="audio-popover-body"><label class="audio-tempo"><span>テンポ</span><output id="audio-tempo-value" for="audio-tempo">120</output><input id="audio-tempo" type="range" min="60" max="180" step="1" value="120" aria-label="テンポ、1分あたりの拍数"/></label><label class="audio-size-label" for="audio-canvas-size">キャンバス</label><select id="audio-canvas-size" aria-label="キャンバスの大きさ"><option value="16">16 × 16</option><option value="32">32 × 16</option><option value="64">64 × 16</option><option value="128">128 × 16</option></select><p class="audio-setting-note">画像の横位置をループ時間に、行を音程に対応させます。2本指で拡大・移動。</p></div></details>
          </div>
        </div>
      </div>
    </section>
