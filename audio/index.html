<body data-tool-name="ドットで音楽" data-tool-short="音楽" data-page="audio" class="app-page app-page--tool-audio audio-tool-body creation-editor">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/" aria-label="PiXiEED ホーム"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a></div></header>
  <main id="main" class="audio-page">
    <h1 class="creation-editor__title">ドットで音楽</h1>
    <p id="audio-status" class="audio-status" role="status" aria-live="polite">1マスに1音。色を選んで描けます。</p>
    <section class="audio-workspace" aria-label="曲の編集">
      <div id="audio-grid-wrap" class="audio-grid-wrap creation-editor__stage" aria-label="音楽ピクセルキャンバス">
        <aside id="audio-pass-required" class="audio-pass-required" hidden aria-live="polite">
          <span>続けるには時間を追加してください。</span>
          <button id="audio-pass-add" type="button">時間を追加</button>
        </aside>
        <canvas id="audio-pixel-canvas" class="audio-pixel-canvas" width="16" height="16" tabindex="0" role="img" aria-label="共有画像のセルを音に割り当てる音楽キャンバス。矢印キーで移動し、EnterまたはSpaceで音を描画します。" aria-describedby="audio-status"></canvas>
        <div id="audio-cursor" class="audio-cursor" aria-hidden="true" hidden></div>
        <div id="audio-playhead" class="audio-playhead" aria-hidden="true" hidden></div>
      </div>
      <div class="audio-controls creation-editor__controls">
        <div class="audio-control-row creation-editor__palette">
          <button id="audio-current" class="audio-current" type="button" aria-label="選択中の色と音色を設定" aria-expanded="false" aria-controls="audio-palette-settings"><span class="audio-current__swatch" aria-hidden="true"></span></button>
          <div id="audio-tracks" class="audio-tracks" role="group" aria-label="描く色を選ぶ"></div>
        </div>
        <div class="audio-tools creation-editor__tools-row" role="group" aria-label="音符を描く道具">
          <button id="audio-tool-pen" type="button" aria-pressed="true" aria-label="ペン"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg></button>
          <button id="audio-tool-eraser" type="button" aria-pressed="false" aria-label="消しゴム"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h11"/><path d="M4 15l9-9 6 6-7 7H8z"/><path d="M9 10l6 6"/></svg></button>
          <details id="audio-palette-settings" class="audio-popover audio-palette-settings"><summary aria-label="色と音色を設定" title="色と音色を設定"><img src="/assets/icons/instruments/music-settings.svg" alt="" aria-hidden="true"></summary><div class="audio-popover-body audio-palette-settings__body"><button id="audio-palette-close" class="audio-palette-close" type="button" aria-label="色と音色の設定を閉じる">×</button><p id="audio-instrument-legend" class="audio-instrument-legend">🔒 印の音色は特典で使えます</p><button id="audio-extra-instruments" class="audio-perk-button" type="button">🔒 追加の音色を使う</button><div id="audio-palette-rows"></div></div></details>
          <details id="audio-composition-settings" class="audio-popover audio-composition-settings"><summary aria-label="テンポとキャンバスを設定"><span id="audio-size-chip" class="audio-size-chip" aria-hidden="true">16</span></summary><div class="audio-popover-body">
            <label class="audio-tempo"><span>テンポ</span><output id="audio-tempo-value" for="audio-tempo">120</output><input id="audio-tempo" type="range" min="60" max="180" step="1" value="120" aria-label="テンポ、1分あたりの拍数"></label>
            <label class="audio-size-label" for="audio-canvas-size">キャンバス</label><select id="audio-canvas-size" aria-label="キャンバスの大きさ"><option value="16">16 × 16</option><option value="32">32 × 16 🔒 特典</option><option value="64">64 × 16 🔒 特典</option><option value="128">128 × 16 🔒 特典</option></select>
            <p class="audio-setting-note">画像の横位置をループ時間に、行を音程に対応させます。2本指で拡大・移動。</p>
          </div></details>
          <span data-pass-slot hidden></span>
        </div>
        <div class="audio-header-actions creation-editor__actions" role="group" aria-label="画像と曲の保存">
          <button id="audio-take-photo" class="audio-icon-button" type="button" aria-label="写真を撮って音楽にする" title="写真から音楽"><img src="/assets/icons/pixieed/camera.svg" alt=""></button>
          <details id="audio-output" class="creation-output"><summary aria-label="保存・書き出し" title="保存・書き出し"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></summary><div class="creation-output__panel"><h2>ファイルに保存</h2><p>画像や音楽を保存・共有できます。</p><button id="audio-export-image" type="button" class="creation-output__card"><strong>画像を保存</strong><small>PNG · ドットをくっきり拡大</small></button><button id="audio-export-sound" type="button" class="creation-output__card"><strong>音を保存</strong><small>WAV · 音声ファイル</small></button><button id="audio-export-video" type="button" class="creation-output__card"><strong>絵と音を動画に</strong><small>1ループ · 音付き動画</small></button><button id="audio-cancel-video" type="button" class="creation-output__cancel" hidden>動画作成を中止</button><div class="creation-output__divider"></div><button type="button" class="creation-output__card" data-output-project><strong>プロジェクト・バックアップ</strong><small>編集を続ける・ほかの端末に移す</small></button></div></details>
          <details id="audio-more" class="audio-popover audio-more">
            <summary aria-label="プロジェクトの保存と読み込み" title="プロジェクトの保存と読み込み"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary>
            <div class="audio-popover-body audio-more__actions">
              <button id="audio-save" type="button">プロジェクトを保存</button>
              <div class="creation-output__project-help">曲と絵をこの端末のプロジェクトに保存します。</div>
              <button id="audio-resume" type="button" hidden>前回の曲を開く</button>
              <div id="audio-shelf" hidden></div>
              <button id="audio-from-camera" type="button" hidden>前のカメラ画像から</button>
            </div>
          </details>
        </div>
      </div>
    </section>
