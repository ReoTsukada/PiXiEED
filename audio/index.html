  <link rel="stylesheet" href="/css/pixieed-design-system.css?rev=20260924-camera-release-1">

<body data-page="audio" class="app-page app-page--tool-audio audio-tool-body">
  <a class="skip-link" href="#main">本文へ移動</a>
  <main id="main" class="audio-page">
    <header class="audio-heading"><h1>かんたん音楽</h1><label class="audio-tempo"><span>BPM</span><output id="audio-tempo-value" for="audio-tempo">120</output><input id="audio-tempo" type="range" min="60" max="180" step="1" value="120" aria-label="テンポ、1分あたりの拍数"></label></header>
    <p id="audio-status" class="audio-status" role="status" aria-live="polite">1マスに1音。色を選んで描けます。</p>
    <section class="audio-workspace" aria-label="曲の編集">
      <div class="audio-controls">
        <div id="audio-tracks" class="audio-tracks" role="group" aria-label="描く色を選ぶ"></div>
        <div class="audio-tools" role="group" aria-label="音符を描く道具">
          <button id="audio-tool-pen" type="button" aria-pressed="true" aria-label="ペン">✎</button>
          <button id="audio-tool-eraser" type="button" aria-pressed="false" aria-label="消しゴム">⌫</button>
          <details id="audio-palette-settings" class="audio-palette-settings"><summary aria-label="色と音色を設定">色と音</summary><div id="audio-palette-rows" class="audio-palette-settings__body"></div></details>
        </div>
      </div>
      <div id="audio-grid-wrap" class="audio-grid-wrap" aria-label="音楽ピクセルキャンバス">
        <canvas id="audio-pixel-canvas" class="audio-pixel-canvas" width="16" height="16" tabindex="0" role="img" aria-label="16列×16音程の音楽ピクセルキャンバス。横が時間、縦が音程です。矢印キーで移動し、EnterまたはSpaceで音を描画します。" aria-describedby="audio-status"></canvas>
        <div id="audio-cursor" class="audio-cursor" aria-hidden="true" hidden></div>
        <div id="audio-playhead" class="audio-playhead" aria-hidden="true" hidden></div>
      </div>
    </section>
    <details class="audio-more">
      <summary>画像・保存</summary>
      <div class="audio-more__actions">
        <button id="audio-from-draw" type="button" hidden>保存絵から作曲</button>
        <button id="audio-from-camera" type="button" hidden>カメラから作曲</button>
        <a href="/pixel-camera.html?to=audio">写真を撮る</a>
        <button id="audio-save" type="button">端末に保存</button>
        <button id="audio-resume" type="button" hidden>前回の曲を開く</button>
      </div>
    </details>
  </main>
  <nav class="app-tabs" aria-label="アプリナビゲーション">
    <a data-nav="home" href="/home/" aria-label="ホーム"><img src="/assets/icons/pixieed/home.svg" alt=""></a>
    <a data-nav="map" href="/" aria-label="地図"><img src="/assets/icons/pixieed/globe.svg" alt=""></a>
    <button id="audio-play-toggle" type="button" aria-label="曲を再生" aria-pressed="false">再生</button>
    <a data-nav="tools" href="/tools/" aria-label="ツール"><img src="/assets/icons/pixieed/tools.svg" alt=""></a>
    <a data-nav="profile" href="/profile/" aria-label="マイページ"><img src="/assets/icons/pixieed/profile.svg" alt=""></a>
  </nav>
  <script type="module" src="/js/creation/audio-page.mjs?rev=20260928-pending-playback-1"></script>
</body>
</html>
