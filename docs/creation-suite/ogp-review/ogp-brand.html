<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>PiXiEED OGP・正式ロゴと文字のレビュー案</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { background: #f7f8f6; color: #1b2025; font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; }
    .card { position: relative; width: 1200px; height: 630px; }
    .logo { position: absolute; left: 80px; top: 56px; width: 144px; height: 144px; background: #17232d; }
    .logo img { display: block; width: 144px; height: 144px; image-rendering: pixelated; }
    .brand { position: absolute; left: 256px; top: 96px; margin: 0; font-size: 52px; line-height: 64px; font-weight: 800; letter-spacing: 0; }
    h1 { position: absolute; left: 80px; top: 244px; margin: 0; font-size: 80px; line-height: 104px; font-weight: 800; letter-spacing: 0; }
    .features { position: absolute; left: 84px; top: 472px; margin: 0; font-size: 32px; line-height: 48px; font-weight: 600; letter-spacing: 0; }
    .accent { position: absolute; left: 84px; top: 568px; width: 16px; height: 16px; background: #e75445; }
    .domain { position: absolute; left: 116px; top: 558px; margin: 0; font-size: 24px; line-height: 40px; font-weight: 600; letter-spacing: 0; }
  </style>
</head>
<body>
  <main class="card" aria-label="PiXiEED。ドット絵で、つくる。あそぶ。描く・撮る・音楽・パズル。pixieed.jp">
    <div class="logo"><img src="../../../assets/brand/pixieed-logo-48.png" width="144" height="144" alt="PiXiEED正式ロゴ"></div>
    <p class="brand">PiXiEED</p>
    <h1>ドット絵で、<br>つくる。あそぶ。</h1>
    <p class="features">描く・撮る・音楽・パズル</p>
    <span class="accent" aria-hidden="true"></span>
    <p class="domain">pixieed.jp</p>
  </main>
</body>
</html>
