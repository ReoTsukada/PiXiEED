    <div class="draw-meta"><p id="draw-size-label" class="draw-size-label" aria-live="polite">16×16px</p><p id="draw-status" class="draw-status" role="status" aria-live="polite">新しい絵を準備しています。</p><span id="draw-zoom-label" aria-live="polite">100%</span></div>
      <div class="draw-viewport">

v id="draw-shelf" hidden></div><div class="creation-output__divider"></div><button type="button" class="creation-output__card" data-output-project><strong>作品を管理</strong><small>名前・保存・読み込み</small></button></div></details><button id="draw-to-globe" type="button" aria-label="地球儀へ投稿" title="地球儀へ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.4 2.2 3.6 4.9 3.6 8s-1.2 5.8-3.6 8c-2.4-2.2-3.6-4.9-3.6-8S9.6 6.2 12 4z"/></svg></button><details class="draw-import"><summary id="draw-import-summary" aria-label="キャンバス設定" title="キャンバス設定" aria-controls="draw-canvas-options"><span id="draw-size-chip" class="draw-size-chip">16</span></summary><div id="draw-canvas-options" class="draw-import__options draw-canvas-panel"><header><h2>キャンバス設定</h2><p id="draw-canvas-dimensions" aria-live="polite">16 × 16 px</p></header><p id="draw-canvas-resize-help" class="draw-canvas-resize-help">絵の1pxを保ち、中央を基準に余白を変更します。小さくすると外側が切れます。「戻す」で復元できます。</p><div class="draw-size-seg" role="radiogroup" aria-label="長辺のサイズ"><button type="button" role="radio" data-draw-size="16" aria-label="長辺16px">16</button><button type="button" role="radio" data-draw-size="32" aria-label="長辺32px">32</button><button type="button" role="radio" data-draw-size="64" aria-label="長辺64px">64</button><button type="button" role="radio" data-draw-size="128" aria-label="長辺128px">128</button><button type="button" role="radio" data-draw-size="256" aria-label="長辺256px">256</button></div><form id="draw-canvas-form" aria-describedby="draw-canvas-resize-help"><div class="draw-canvas-panel__dimensions"><label for="draw-canvas-width">幅<input id="draw-canvas-width" type="number" min="1" max="256" step="1" value="16" inputmode="numeric"></label><label for="draw-canvas-height">高さ<input id="draw-canvas-height" type="number" min="1" max="256" step="1" value="16" inputmode="numeric"></label></div><label class="draw-canvas-panel__ratio"><input id="draw-canvas-ratio" type="checkbox" checked>縦横比を固定</label>
