<body data-tool-name="かんたんゲーム" data-tool-short="ゲーム" data-page="creation-game" class="app-page app-page--tool-creation-game">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/" aria-label="PiXiEED ホーム"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a></div></header>
  <main id="main" class="game-page">
    <header class="game-heading"><h1>かんたんゲーム</h1><p>画像を選んで、歩いて星を集めるゲームを作ろう。</p></header>
    <p id="game-status" class="game-status" role="status" aria-live="polite">キャラクター画像と背景画像を選んでください。ファイルは端末内だけで使います。</p>
    <section id="game-setup" class="game-setup" aria-label="端末からゲーム素材を選ぶ">
      <label class="game-file-field">キャラクター画像 (PNG/WebP・2MBまで)<input id="game-character-file" type="file" accept="image/png,image/webp"><span id="game-character-summary">ファイルを選んでください。</span><img id="game-character-preview" class="game-file-preview game-file-preview--character" alt="選んだキャラクター画像のプレビュー" hidden></label>
      <label class="game-file-field">背景画像 (PNG/WebP・2MBまで)<input id="game-background-file" type="file" accept="image/png,image/webp"><span id="game-background-summary">ファイルを選んでください。</span><img id="game-background-preview" class="game-file-preview" alt="選んだ背景画像のプレビュー" hidden></label>
      <label class="game-file-field">音素材 (任意・MP3/OGG/WAV/M4A/AAC/WebM/FLAC・3MBまで)<input id="game-music-file" type="file" accept="audio/mpeg,audio/ogg,audio/wav,audio/mp4,audio/aac,audio/webm,audio/flac"><span id="game-music-summary">音を選ばない場合は無音です。</span></label>
      <audio id="game-audio-preview" controls preload="none" aria-label="選んだ音素材を試聴" hidden></audio>
      <button id="game-prepare" type="button" disabled>選んだ素材でプレビュー</button>
      <button id="game-resume" type="button" hidden>前回のゲームを再開</button>
      <p>画像は縦横4096px以下・合計1024×1024画素まで。選んだ画像と音を端末内に保存して再開します。サーバーへ送信しません。</p>
    </section>
    <section id="game-play" class="game-play" hidden aria-label="歩いて集めるゲーム">
      <p id="game-assets-label" class="game-assets-label"></p>
      <div class="game-board-wrap"><canvas id="game-board" width="320" height="256" role="img" aria-label="ゲームの盤面。盤面をタップして進む方向を選び、キャラクターをドラッグして1マス進みます。矢印キーや方向ボタンも使えます。" tabindex="0"></canvas></div>
      <p id="game-progress" class="game-progress" aria-live="polite"></p>
      <div class="game-controls" role="group" aria-label="移動する">
        <span></span><button type="button" data-game-direction="up" aria-label="上へ1マス">↑</button><span></span>
        <button type="button" data-game-direction="left" aria-label="左へ1マス">←</button><button type="button" data-game-direction="down" aria-label="下へ1マス">↓</button><button type="button" data-game-direction="right" aria-label="右へ1マス">→</button>
      </div>
      <div class="game-actions"><button id="game-save" type="button" disabled>端末に保存</button><button id="game-new" type="button">素材を選び直す</button></div>
      <p id="game-win" class="game-win" role="status" hidden>星を集めてゴールしました。</p>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><p>PiXiEED</p></div></footer>
