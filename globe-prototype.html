<body>
  <main class="globe-prototype" aria-labelledby="prototypeTitle">
    <header class="prototype-header">
      <div>
        <p class="eyebrow">PiXiEED</p>
        <h1 id="prototypeTitle" class="sr-only">PiXiEED地球儀</h1>
      </div>
      <p id="loadStatus" class="load-status" role="status">地図データを読み込み中…</p>
      <div id="accountSlot" class="account" aria-label="アカウント"></div>
    </header>

    <section id="globeStage" class="globe-stage" aria-label="インタラクティブな地球儀">
      <canvas id="skyCanvas" aria-hidden="true"></canvas>
      <canvas id="globeCanvas" tabindex="0" aria-label="地球儀。ドラッグで回転、ピンチまたはホイールでズーム、2本指タップで縮小、タップでセルを選択、長押しでその場所から空を見る、いちばん小さくしてからさらに縮小すると太陽系。キーボードでは矢印で回転、プラスとマイナスでズーム、0で初期表示"></canvas>
      <p id="gestureHint" class="gesture-hint" hidden><span>ドラッグで回す</span><span>ピンチで拡大・縮小</span><span>長押しで空を見る</span><span>さらに縮小で太陽系へ</span></p>
      <nav id="astroViewSwitch" class="astro-views" aria-label="表示を切り替える">
        <button type="button" data-astro-view="globe" aria-label="作品の地球儀へ戻る" aria-pressed="true"><img src="/assets/icons/pixieed/globe.svg" alt=""><span>作品</span></button>
        <button type="button" data-astro-view="sky" aria-label="この場所の星空を見る" aria-pressed="false"><img src="/assets/icons/pixieed/telescope.svg" alt=""><span>星空</span></button>
        <button type="button" data-astro-view="solar" aria-label="太陽系を見る" aria-pressed="false"><img src="/assets/icons/pixieed/solar-system.svg" alt=""><span>太陽系</span></button>
      </nav>
      <aside id="selectionPanel" class="selection-panel" aria-live="polite" hidden>
        <span id="selectedStage"></span>
        <strong id="selectedOwner"></strong>
        <button id="placeHere" class="place-here" type="button" aria-label="選択したセルに作品を置く">
          <img src="/assets/icons/pixieed/add.svg" alt="">
        </button>
      </aside>
    </section>

  </main>
