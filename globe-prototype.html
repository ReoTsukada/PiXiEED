<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiXiEED地球儀</title>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get('embed') === '1') document.documentElement.classList.add('is-embedded');
      if (location.protocol === 'file:') {
        var target = new URL('/globe-prototype.html', 'http://127.0.0.1:4173');
        target.search = location.search;
        target.hash = location.hash;
        location.replace(target.href);
      }
    }());
  </script>
  <link rel="stylesheet" href="css/globe-prototype.css?v=20260926-hud-v1">
  <!-- Flatten the module waterfall and fetch the land-mask raster in parallel. -->
  <link rel="modulepreload" href="js/globe/renderer.mjs?v=20260926-hud-v1">
  <link rel="modulepreload" href="js/globe/astro-ui.mjs?v=20260926-hud-v1">
  <link rel="modulepreload" href="js/globe/post-ui.mjs?v=20260921-tool-shell-v1">
  <link rel="modulepreload" href="js/globe/geometry.mjs?v=20260921-grid11-1">
  <link rel="modulepreload" href="js/globe/topology.mjs?v=20260920-g4-precision-1">
  <link rel="modulepreload" href="js/globe/hierarchy.mjs?v=20260920-g4-precision-1">
  <link rel="modulepreload" href="js/globe/webgl-renderer.mjs?v=20260921-astro-4">
  <link rel="modulepreload" href="assets/maps/world-land-mask-v1.mjs?v=20260920-webgl2-1">
  <script>
    globalThis.__PIXIEED_GLOBE_RASTER__ = location.protocol === 'file:' ? null : fetch('assets/maps/globe-land-mask-v1.json?v=20260921-grid11-1', { cache: 'force-cache' })
      .then(function (response) { if (!response.ok) throw new Error('raster ' + response.status); return response.json(); });
    globalThis.__PIXIEED_GLOBE_RASTER__.catch(function () {});
    // If loading stalls, show a short recovery message instead of implementation details.
    setTimeout(function () {
      var status = document.getElementById('loadStatus');
      if (!globalThis.__PIXIEED_GLOBE__ && status && status.textContent.indexOf('読み込み中') >= 0) {
        status.textContent = '地球儀を読み込めませんでした。ページを再読み込みしてください。';
      }
    }, 8000);
  </script>
</head>
<body>
  <main class="globe-prototype" aria-labelledby="prototypeTitle">
    <header class="prototype-header">
      <div>
        <p class="eyebrow">PiXiEED</p>
        <h1 id="prototypeTitle" class="sr-only">PiXiEED地球儀</h1>
      </div>
      <p id="loadStatus" class="load-status" role="status">地図データを読み込み中…</p>
      <div id="accountSlot" class="account" aria-label="アカウント"></div>
    </header>

    <section id="globeStage" class="globe-stage" aria-label="インタラクティブな地球儀">
      <canvas id="globeCanvas" tabindex="0" aria-label="地球儀。ドラッグで回転、ピンチまたはホイールでズーム、2本指タップで縮小、タップでセルを選択、長押しでその場所から空を見る。キーボードでは矢印で回転、プラスとマイナスでズーム、0で初期表示"></canvas>
      <p id="gestureHint" class="gesture-hint" hidden><span>ドラッグで回す</span><span>ピンチで拡大・縮小</span><span>長押しで空を見る</span></p>
      <aside id="selectionPanel" class="selection-panel" aria-live="polite" hidden>
        <span id="selectedStage"></span>
        <strong id="selectedOwner"></strong>
        <button id="placeHere" class="place-here" type="button" aria-label="選択したセルに作品を置く">
          <img src="/assets/icons/pixieed/add.svg" alt="">
        </button>
      </aside>
    </section>

  </main>
  <script type="module" src="js/globe/prototype.mjs?v=20260926-hud-v1"></script>
</body>
</html>
