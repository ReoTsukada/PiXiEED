  <script>
    var telescope = new URLSearchParams(location.search).get('tool') === 'telescope';
    var request = location.protocol === 'file:' ? null : fetch(telescope ? 'assets/maps/globe-land-mask-v1.json?v=20260921-grid11-1' : 'assets/maps/globe-land-mask-v1.json?v=20260921-grid11-1', { cache: 'force-cache' })
      .then(function (response) { if (!response.ok) throw new Error('map ' + response.status); return response.json(); });
    globalThis[telescope ? '__PIXIEED_GLOBE_RASTER__' : '__PIXIEED_MAP_CELLS__'] = request;
    request?.catch(function () {});
    if (!telescope && location.protocol !== 'file:') {
      globalThis.__PIXIEED_MAP_PREFECTURES__ = fetch('assets/maps/map-prefectures-v1.json?v=20261006-unassigned-northern-islands-1', { cache: 'force-cache' })
        .then(function (response) { if (!response.ok) throw new Error('map areas ' + response.status); return response.json(); });
      globalThis.__PIXIEED_MAP_PREFECTURES__.catch(function () {});
      globalThis.__PIXIEED_MAP_ADMIN1__ = fetch('assets/maps/map-admin1-v1.json?v=20261005-admin-boundary-1', { cache: 'force-cache' })
        .then(function (response) { if (!response.ok) throw new Error('Administrative regions unavailable'); return response.json(); });
      globalThis.__PIXIEED_MAP_ADMIN1__.catch(function () {});
    }
    // If loading stalls, show a short recovery message instead of implementation details.
    setTimeout(function () {
      var status = document.getElementById('loadStatus');
      if (!globalThis.__PIXIEED_GLOBE__ && status && status.textContent.indexOf('読み込み中') >= 0) {
        status.textContent = '地図を読み込めませんでした。ページを再読み込みしてください。';

<link rel="icon" href="/favicon.ico" sizes="any">

<body>
  <main class="globe-prototype" aria-labelledby="prototypeTitle">
    <header class="prototype-header">
      <div>
        <p class="eyebrow">PiXiEED</p>
        <h1 id="prototypeTitle" class="sr-only">PiXiEED地図</h1>
      </div>
      <p id="loadStatus" class="load-status" role="status">地図データを読み込み中…</p>
      <div id="accountSlot" class="account" aria-label="アカウント"></div>
    </header>

    <section id="globeStage" class="globe-stage" aria-label="インタラクティブな地図">
      <canvas id="skyCanvas" aria-hidden="true"></canvas>
      <canvas id="globeCanvas" tabindex="0" aria-label="地図。ドラッグで移動、横方向は繰り返し表示、ピンチまたはホイールでズーム、2本指タップで縮小、タップで地域を選択、ダブルクリックで拡大、Escapeで選択解除。キーボードでは矢印で移動、プラスとマイナスでズーム、0で初期表示"></canvas>
      <p id="gestureHint" class="gesture-hint" hidden><span>ドラッグで移動</span><span>ピンチで拡大・縮小</span><span>タップで地域を選択</span></p>
      <nav id="mapLayerSwitch" class="map-layers" aria-label="地図に表示する内容">
        <button type="button" data-map-content="posts" aria-pressed="true"><i aria-hidden="true"></i><span>みんなの投稿</span></button>
        <button type="button" data-map-content="events" aria-pressed="false"><i aria-hidden="true"></i><span>イベント</span></button>
      </nav>
      <div id="cellTooltip" class="map-cell-tooltip" role="tooltip" hidden>
        <strong data-cell-name></strong><span data-cell-posts></span>
      </div>
      <aside id="selectionPanel" class="selection-panel" aria-label="選択した場所" aria-live="polite" hidden>
        <div class="selection-panel__head">
          <div class="selection-panel__info"><span id="selectedStage">選択中のセル</span><strong id="selectedOwner"></strong></div>
          <button id="clearCellSelection" class="selection-panel__close" type="button" aria-label="地域の選択を解除"><img src="/assets/icons/pixieed/close.svg" alt=""></button>
        </div>
        <div class="selection-panel__actions">
          <button id="viewCellPosts" type="button"><img src="/assets/icons/pixieed/artwork.svg" alt=""><span><span id="selectedContentKind">投稿 </span><span id="selectedPostCount">0</span>件</span></button>
          <button id="zoomToCell" type="button" aria-label="選択した場所を拡大"><img src="/assets/icons/pixieed/zoom-in.svg" alt=""><span>拡大</span></button>
          <button id="placeHere" class="place-here" type="button" aria-label="選択した地域に作品を置く"><img src="/assets/icons/pixieed/add.svg" alt=""><span>投稿する</span></button>
        </div>
      </aside>
    </section>

  </main>
  <nav class="globe-app-tabs" aria-label="アプリナビゲーション">
    <a href="/globe/" aria-label="地図" data-globe-nav-map><img src="/assets/icons/pixieed/globe.svg" alt=""></a>
    <a href="/pixel-camera.html?from=globe" aria-label="撮影"><img src="/assets/icons/pixieed/shoot.svg" alt=""></a>
    <button id="globePrimaryAction" type="button" aria-label="作品を投稿する"><img src="/assets/icons/pixieed/add.svg" alt=""></button>
    <a href="/tools/" aria-label="ツール" data-globe-nav-tools><img src="/assets/icons/pixieed/tools.svg" alt=""></a>
    <a href="/profile/" aria-label="マイページ"><img src="/assets/icons/pixieed/profile.svg" alt=""></a>
  </nav>
