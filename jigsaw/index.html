<body data-tool-name="かんたんジグソー" data-tool-short="ジグソー" data-page="jigsaw" class="app-page app-page--tool-jigsaw">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/" aria-label="PiXiEED ホーム"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a></div></header>
  <main id="main" class="jigsaw-page">
    <header class="jigsaw-heading"><div><h1>かんたんジグソー</h1><p>PiXiEEDの公開作品や、自分で選んだ絵で遊べます。</p></div></header>
    <p id="jigsaw-status" class="jigsaw-status" role="status" aria-live="polite">絵の種類を選んでください。</p>
    <section id="jigsaw-setup" class="jigsaw-setup" aria-label="パズルを準備">
      <label class="jigsaw-field">絵の種類<select id="jigsaw-source-kind" aria-label="絵の種類"><option value="draw">ジグソーの絵</option><option value="public">PiXiEEDの公開作品</option><option value="file">端末から選ぶ</option></select></label>
      <div id="jigsaw-shelf" hidden></div>
      <label id="jigsaw-draw-source" class="jigsaw-field">元の絵の保存版<select id="jigsaw-source-version" aria-label="元にする自分の保存版"></select></label>
      <label id="jigsaw-public-source" class="jigsaw-field" hidden>公開作品<select id="jigsaw-public-version" aria-label="パズルにする公開作品"></select></label>
      <label id="jigsaw-file-source" class="jigsaw-field" hidden>画像ファイル（PNG、WebP、JPEG）<input id="jigsaw-file" type="file" accept="image/png,image/webp,image/jpeg,.png,.webp,.jpg,.jpeg"></label>
      <label class="jigsaw-field" hidden aria-hidden="true">ピースの大きさ<select id="jigsaw-grid-size" aria-label="ピースの大きさ"><option value="auto" selected>おまかせ</option><option value="3">約3px・細かい</option><option value="6">約6px</option><option value="12">約12px</option><option value="24">約24px</option><option value="48">約48px</option><option value="96">約96px・大きめ</option></select></label>
      <p id="jigsaw-piece-count" class="jigsaw-piece-count" aria-live="polite">画像を選ぶとピース数の目安が表示されます。</p>
      <div class="jigsaw-setup__actions"><button id="jigsaw-start" type="button" disabled>パズルをはじめる</button><button id="jigsaw-resume" type="button" hidden>前回のパズルを再開</button><button id="jigsaw-current" type="button" hidden>直前のパズルを開く</button></div>
      <p class="jigsaw-help">公開作品はこの端末で遊ぶためだけに読み込みます。選んだ画像の投稿やアップロードは行いません。3px未満のピースは作成できません。</p>
    </section>
    <section id="jigsaw-play" class="jigsaw-play" aria-label="ジグソーパズル" hidden>
      <p id="jigsaw-source-label" class="jigsaw-source-label"></p>
      <div class="jigsaw-workspace-tools" role="toolbar" aria-label="選択中のピースグループ">
        <button id="jigsaw-preview-toggle" type="button" aria-label="完成図を表示" aria-pressed="false" aria-expanded="false" aria-controls="jigsaw-preview" title="完成図を表示"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m5 17 5-6 4 4 2-2 3 4"/><circle cx="16" cy="8" r="1.5"/></svg><span class="jigsaw-preview-indicator" aria-hidden="true">✓</span></button>
        <button id="jigsaw-hint" type="button" aria-label="ヒント" title="ヒント"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
        <button id="jigsaw-rotate" type="button" aria-label="選択中を90度回転" title="90度回転"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></svg></button>
        <button id="jigsaw-return" type="button" aria-label="選択中をトレーへ戻す" title="トレーへ戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13v7h18v-7M7 12l5 5 5-5M12 3v14"/></svg></button>
        <details class="jigsaw-more"><summary aria-label="その他の操作" title="その他の操作"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></summary><div class="jigsaw-more__menu" role="group" aria-label="作業スペースとピースの操作">
          <button id="jigsaw-fit" type="button" aria-label="作業スペース全体を表示" title="拡大と移動を初期位置に戻す">全体を見る <output id="jigsaw-view-scale" aria-label="拡大率">100%</output></button>
          <div class="jigsaw-more__pages" role="group" aria-label="トレーのページ">
            <button id="jigsaw-tray-prev" type="button" aria-label="前のページ" title="前のページ">‹</button>
            <span id="jigsaw-tray-page" aria-live="polite" aria-label="現在のページ">1 / 1</span>
            <button id="jigsaw-tray-next" type="button" aria-label="次のページ" title="次のページ">›</button>
          </div>
          <button id="jigsaw-new" type="button" aria-label="別の絵でパズルを作る" title="現在のプレイを閉じて絵を選ぶ">別の絵を選ぶ</button>
        </div></details>
        <span id="jigsaw-selection" role="status" aria-live="polite">ピースを選択してください</span>
      </div>
      <div id="jigsaw-workspace" class="jigsaw-workspace" tabindex="0" role="application" aria-label="自由配置できるジグソー作業スペース">
        <canvas id="jigsaw-board" class="jigsaw-board" aria-label="元絵のピースを自由に配置する場所"></canvas>
      </div>
      <div id="jigsaw-tray" class="jigsaw-tray" role="group" aria-label="まだ置いていないピース"></div>
      <p id="jigsaw-complete" class="jigsaw-complete" role="status" hidden>完成しました。</p>
    </section>
  </main>
  <aside id="jigsaw-preview" class="jigsaw-preview" aria-label="完成図" hidden>
    <div class="jigsaw-preview__head" tabindex="0" role="group" aria-label="完成図の移動。ドラッグするか、矢印キーで移動できます。">
      <span>完成図</span><button id="jigsaw-preview-close" type="button" aria-label="完成図を閉じる" title="閉じる">×</button>
    </div>
    <canvas id="jigsaw-preview-canvas" class="jigsaw-preview__canvas" aria-label="パズルの完成図"></canvas>
    <div class="jigsaw-preview__foot"><span id="jigsaw-preview-size" aria-live="polite"></span><button id="jigsaw-preview-resize" type="button" aria-label="完成図のサイズ変更。ドラッグ、矢印キー、HomeとEndで調整" title="サイズ変更（矢印キーでも操作できます）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 19 19m-8 0h8v-8M5 13V5h8"/></svg></button></div>
  </aside>
