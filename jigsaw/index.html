<body data-page="jigsaw" class="app-page app-page--tool-jigsaw">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/" aria-label="PiXiEED ホーム"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a></div></header>
  <main id="main" class="jigsaw-page">
    <header class="jigsaw-heading"><div><h1>かんたんジグソー</h1><p>PiXiEEDの公開作品や、自分で選んだ絵で遊べます。</p></div></header>
    <p id="jigsaw-status" class="jigsaw-status" role="status" aria-live="polite">絵の種類を選んでください。</p>
    <section id="jigsaw-setup" class="jigsaw-setup" aria-label="パズルを準備">
      <label class="jigsaw-field">絵の種類<select id="jigsaw-source-kind" aria-label="絵の種類"><option value="draw">自分のドット絵</option><option value="public">PiXiEEDの公開作品</option><option value="file">端末から選ぶ</option></select></label>
      <label id="jigsaw-draw-source" class="jigsaw-field">元の絵の保存版<select id="jigsaw-source-version" aria-label="元にする自分の保存版"></select></label>
      <label id="jigsaw-public-source" class="jigsaw-field" hidden>公開作品<select id="jigsaw-public-version" aria-label="パズルにする公開作品"></select></label>
      <label id="jigsaw-file-source" class="jigsaw-field" hidden>画像ファイル（PNG、WebP、JPEG）<input id="jigsaw-file" type="file" accept="image/png,image/webp,image/jpeg,.png,.webp,.jpg,.jpeg"></label>
      <label class="jigsaw-field">ピース数<select id="jigsaw-grid-size" aria-label="盤面のピース数"><option value="2">2×2・4ピース</option><option value="3" selected>3×3・9ピース</option><option value="4">4×4・16ピース</option></select></label>
      <div class="jigsaw-setup__actions"><button id="jigsaw-start" type="button" disabled>パズルをはじめる</button><button id="jigsaw-resume" type="button" hidden>前回のパズルを再開</button></div>
      <p class="jigsaw-help">公開作品はこの端末で遊ぶためだけに読み込みます。選んだ画像の投稿やアップロードは行いません。</p>
    </section>
    <section id="jigsaw-play" class="jigsaw-play" aria-label="ジグソーパズル" hidden>
      <p id="jigsaw-source-label" class="jigsaw-source-label"></p>
      <div id="jigsaw-board" class="jigsaw-board" role="group" aria-label="パズル盤面"></div>
      <h2 class="jigsaw-tray-heading">ピースをドラッグ、または選んで置く</h2>
      <div id="jigsaw-tray" class="jigsaw-tray" role="group" aria-label="まだ置いていないピース"></div>
      <p id="jigsaw-complete" class="jigsaw-complete" role="status" hidden>完成しました。</p>
      <div class="jigsaw-play__actions"><button id="jigsaw-new" type="button" aria-label="別の絵でパズルを作る">別の絵</button></div>
    </section>
  </main>
