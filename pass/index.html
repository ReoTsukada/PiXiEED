<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>特典｜PiXiEED</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="/css/site.css?rev=20261001-text-contrast-1">
  <link rel="stylesheet" href="/css/pixieed-design-system.css?rev=20261001-text-contrast-1">
  <link rel="stylesheet" href="/css/site-header.css?rev=20260930-claude-review-1">
  <style>
    .pass-page{min-height:calc(100dvh - 4rem);display:grid;place-items:center;padding:1.5rem 1rem calc(env(safe-area-inset-bottom,0px) + 1.5rem)}
    .pass-card{width:min(100%,22rem);display:grid;gap:1rem;justify-items:center;text-align:center}
    .pass-clock{display:inline-grid;place-items:center;min-width:6.5rem;height:3.2rem;padding:0 1rem;border-radius:999px;background:#ffd35a;color:#15171b;font:900 1.5rem/1 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
    .pass-card p{margin:0;font-size:.95rem;line-height:1.6}
    .pass-card button,.pass-card a.button{min-width:12rem}
    .pass-card [hidden]{display:none}
  </style>
</head>
<body class="app-page" data-tool-name="特典" data-page="pass">
  <main id="main" class="pass-page">
    <section class="pass-card" aria-live="polite">
      <span class="pass-clock" id="passClock">1時間</span>
      <p id="passText">広告を読み込んでいます…</p>
      <button type="button" class="button button--primary" id="passBack" hidden>もどる</button>
    </section>
  </main>
  <script type="module" src="/js/site-header.mjs?rev=20261001-context-1"></script>
  <script type="module" src="/js/pass-page.mjs?rev=20260930-offerwall-1"></script>
</body>
</html>
