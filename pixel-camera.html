<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1114">
  <title>ドット絵カメラ｜PiXiEED</title>
  <meta name="description" content="いつもの景色を、ドット絵に。カメラを向けて撮影し、PNG画像で保存できます。写真は端末内で処理します。">
  <link rel="icon" href="/assets/brand/pixieed-logo-48.png" type="image/png">
  <link rel="stylesheet" href="/css/pixieed-design-system.css?rev=20260924-camera-release-1">
  <link rel="stylesheet" href="css/pixel-lens-camera.css?v=20260928-toolbar-1">
  <link rel="modulepreload" href="js/pixel-lens/app.mjs?v=20260928-toolbar-1">
</head>
<body>
  <a class="pc-skip" href="#stage">カメラへ移動</a>
  <main class="lc" id="pixelStudio" data-mode="loading">
    <!-- The picture is the controller: pinch = zoom, double tap = 1×, tap = pick colours again,
         swipe left/right = look, swipe up/down = front/back camera -->
    <section class="lc-stage" id="stage" aria-label="撮影プレビュー。ピンチでズーム、ダブルタップで等倍、タップで色を選び直し、左右スワイプで色、上下スワイプでカメラ切り替え" tabindex="-1">
      <video id="video" playsinline muted hidden></video>
      <div class="lc-frame" id="captureFrame">
        <canvas id="view" width="1" height="1" aria-hidden="true"></canvas>
      </div>
      <div id="loadingState" class="lc-loading" role="status" aria-live="polite"><span class="lc-spinner" aria-hidden="true"></span><span>カメラを準備しています…</span></div>
      <noscript><p class="lc-noscript">カメラを利用するには JavaScript を有効にしてください。</p></noscript>
      <div id="welcome" class="lc-welcome" hidden>
        <div class="lc-welcome-card">
          <img src="/assets/icons/pixieed/camera.svg" alt="" width="40" height="40">
          <p><strong>カメラは停止中です</strong><span>中央のボタンで再開できます</span></p>
        </div>
      </div>
      <div class="lc-rec" id="gifRec" hidden role="status"><i aria-hidden="true"></i>GIF <span id="gifRecTime">5.0s</span></div>
      <div class="lc-hint" id="gestureHint" hidden>
        <p><b>↔</b><span>左右スワイプで色</span></p>
        <p><b>↕</b><span>上下スワイプでカメラ切替</span></p>
        <p><b>●</b><span>シャッター長押しでGIF</span></p>
        <p><b>▦</b><span>下のボタンで色・ディザ・ドット数など</span></p>
      </div>
      <div class="lc-zoom-hud" id="zoomHud" aria-hidden="true">
        <span class="lc-zoom-hud-value" id="zoomHudValue">1×</span>
        <span class="lc-zoom-hud-track"><i id="zoomHudFill"></i></span>
        <span class="lc-zoom-hud-hint" id="zoomHudHint">光学</span>
      </div>
    </section>

    <header class="lc-top">
      <a class="lc-round lc-back" href="/tools/" aria-label="ツール一覧へ戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 class="pc-sr-only">ドット絵カメラ</h1>
      <div class="lc-zoom-stops" id="zoomStops" role="group" aria-label="ズーム"></div>
      <div id="cameraControls" class="lc-top-right">
        <button id="flipCamera" class="lc-round" type="button" aria-label="インカメラと外カメラを切り替え" title="カメラ切り替え" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg></button>
      </div>
    </header>

    <div class="lc-bottom">
      <div class="lc-feedback">
        <p id="stageMsg" class="lc-toast pc-sr-only" role="status" aria-live="polite" hidden></p>
        <p id="info" class="pc-sr-only">写真はこの端末で処理します。</p>
        <span class="pc-sr-only"><span id="cameraStatus">準備中</span><span id="frameDimensions"></span></span>
      </div>
      <!-- Tray: the row of choices for whichever toolbar button is open (one at a time) -->
      <div class="lc-tray" id="tray">
        <div class="lc-row lc-looks" id="looks" data-panel="look" role="radiogroup" aria-label="色" hidden>
          <button type="button" role="radio" data-look="gb" aria-checked="true"><i class="lc-sw" style="--a:#e0f8d0;--b:#a8c070;--c:#587830;--d:#203810"></i><span>GB</span></button>
          <button type="button" role="radio" data-look="mono" aria-checked="false"><i class="lc-sw" style="--a:#fff;--b:#fff;--c:#000;--d:#000"></i><span>白黒</span></button>
          <button type="button" role="radio" data-look="gray" aria-checked="false"><i class="lc-sw" style="--a:#eee;--b:#aaa;--c:#666;--d:#222"></i><span>グレー</span></button>
          <button type="button" role="radio" data-look="c8" aria-checked="false"><i class="lc-sw" style="--a:#f4d35e;--b:#ee964b;--c:#0d3b66;--d:#2a2a2a"></i><span>8色</span></button>
          <button type="button" role="radio" data-look="c16" aria-checked="false"><i class="lc-sw" style="--a:#f7c59f;--b:#ef6f6c;--c:#2a9d8f;--d:#264653"></i><span>16色</span></button>
          <button type="button" role="radio" data-look="photo" aria-checked="false"><i class="lc-sw lc-sw-photo"></i><span>写真の色</span></button>
          <button type="button" role="radio" data-look="c256" aria-checked="false"><i class="lc-sw lc-sw-rainbow"></i><span>256色</span></button>
          <button type="button" role="radio" data-look="full" aria-checked="false"><i class="lc-sw lc-sw-full"></i><span>フル</span></button>
        </div>
        <div class="lc-row" id="ditherKinds" data-panel="dither" role="radiogroup" aria-label="ディザの模様" hidden></div>
        <div class="lc-row" id="pixelsPanel" data-panel="pixels" role="radiogroup" aria-label="ドット数（長い辺）" hidden></div>
        <div class="lc-row" id="aspectPanel" data-panel="aspect" role="radiogroup" aria-label="縦横比" hidden></div>
        <div class="lc-tone" data-panel="tone" hidden>
          <div class="lc-row" id="toneChips" role="radiogroup" aria-label="調整する項目"></div>
          <div class="lc-slider"><input id="toneSlider" type="range" min="-100" max="100" step="1" value="0"><output id="toneValue">0</output><button id="toneReset" class="lc-reset" type="button" aria-label="色調整を元に戻す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button></div>
        </div>
      </div>
      <!-- Toolbar: five buttons, each showing its current value -->
      <div class="lc-toolbar" id="toolbar" role="toolbar" aria-label="撮影の設定">
        <button type="button" data-tool="look" aria-expanded="false" aria-controls="tray"><i class="lc-tool-sw lc-sw" aria-hidden="true"></i><b>GB</b><small>色</small></button>
        <button type="button" data-tool="dither" aria-expanded="false" aria-controls="tray" data-state="on"><i class="lc-tool-sw lc-tool-dither" aria-hidden="true"></i><b>網目 8×8</b><small>ディザ</small></button>
        <button type="button" data-tool="pixels" aria-expanded="false" aria-controls="tray"><i class="lc-tool-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="4" height="4"/><rect x="10" y="4" width="4" height="4" opacity=".55"/><rect x="16" y="4" width="4" height="4"/><rect x="4" y="10" width="4" height="4" opacity=".55"/><rect x="10" y="10" width="4" height="4"/><rect x="16" y="10" width="4" height="4" opacity=".55"/><rect x="4" y="16" width="4" height="4"/><rect x="10" y="16" width="4" height="4" opacity=".55"/><rect x="16" y="16" width="4" height="4"/></svg></i><b>256 px</b><small>ドット</small></button>
        <button type="button" data-tool="aspect" aria-expanded="false" aria-controls="tray"><i class="lc-tool-ic lc-tool-frame" aria-hidden="true"></i><b>画面</b><small>比率</small></button>
        <button type="button" data-tool="tone" aria-expanded="false" aria-controls="tray"><i class="lc-tool-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></i><b>調整</b><small>色味</small></button>
      </div>
      <div id="resultControls" class="lc-result" hidden>
          <a id="savePng" class="lc-save" aria-disabled="true" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 19h14"/></svg><span id="saveLabel">PNGを保存</span></a>
      </div>
    </div>


  </main>
  <nav class="app-tabs pc-nav" aria-label="アプリナビゲーション" data-nav="five">
    <a data-nav="home" href="/home/" aria-label="ホーム"><img src="/assets/icons/pixieed/home.svg" alt=""></a>
    <a data-nav="map" href="/" aria-label="地図"><img src="/assets/icons/pixieed/globe.svg" alt=""></a>
    <button id="capture" class="pc-nav-action" data-action="capture" type="button" aria-label="表示中の画像を撮影（長押しでGIF）" title="タップで撮影・長押しでGIF" disabled>
      <span class="pc-nav-shutter" aria-hidden="true"></span>
      <img class="pc-nav-resume" src="/assets/icons/pixieed/camera.svg" alt="">
      <img class="pc-nav-retake" src="/assets/icons/pixieed/reset.svg" alt="">
    </button>
    <a data-nav="tools" href="/tools/" aria-label="ツール" aria-current="page"><img src="/assets/icons/pixieed/celestial.svg" alt=""></a>
    <a data-nav="profile" href="/profile/" aria-label="マイページ"><img src="/assets/icons/pixieed/profile.svg" alt=""></a>
  </nav>
  <script type="module" src="js/pixel-lens/app.mjs?v=20260928-toolbar-1"></script>
</body>
</html>
