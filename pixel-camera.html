<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1114">
  <title>ドット絵カメラ｜PiXiEED</title>
  <meta name="description" content="いつもの景色を、ドット絵に。カメラを向けて撮影し、PNG画像で保存できます。写真は端末内で処理します。">
  <link rel="icon" href="/assets/brand/pixieed-logo-48.png" type="image/png">
  <link rel="stylesheet" href="/css/pixieed-design-system.css?rev=20260924-camera-release-1">
  <link rel="stylesheet" href="css/pixel-lens-camera.css?v=20260926-ux-1">
  <link rel="modulepreload" href="js/pixel-lens/app.mjs?v=20260926-ux-1">
</head>
<body>
  <a class="pc-skip" href="#stage">カメラへ移動</a>
  <main class="lc" id="pixelStudio" data-mode="loading">
    <!-- Camera view: pinch to zoom, double tap for 1×, tap to pick colours again -->
    <section class="lc-stage" id="stage" aria-label="撮影プレビュー。ピンチでズーム、ダブルタップで等倍、タップで色を選び直し" tabindex="-1">
      <video id="video" playsinline muted hidden></video>
      <div class="lc-frame" id="captureFrame">
        <canvas id="view" width="1" height="1" aria-hidden="true"></canvas>
      </div>
      <div id="loadingState" class="lc-loading" role="status" aria-live="polite"><span class="lc-spinner" aria-hidden="true"></span><span>カメラを準備しています…</span></div>
      <noscript><p class="lc-noscript">カメラを利用するには JavaScript を有効にしてください。</p></noscript>
      <div id="welcome" class="lc-welcome" hidden>
        <div class="lc-welcome-card">
          <img src="/assets/icons/pixieed/camera.svg" alt="" width="40" height="40">
          <p><strong>カメラは停止中です</strong><span>中央のボタンで再開できます</span></p>
        </div>
      </div>
      <div class="lc-zoom-hud" id="zoomHud" aria-hidden="true">
        <span class="lc-zoom-hud-value" id="zoomHudValue">1×</span>
        <span class="lc-zoom-hud-track"><i id="zoomHudFill"></i></span>
        <span class="lc-zoom-hud-hint" id="zoomHudHint">光学</span>
      </div>
    </section>

    <header class="lc-top">
      <a class="lc-round lc-back" href="/tools/" aria-label="ツール一覧へ戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 class="pc-sr-only">ドット絵カメラ</h1>
      <div class="lc-zoom-stops" id="zoomStops" role="group" aria-label="ズーム"></div>
      <div id="cameraControls" class="lc-top-right">
        <button id="flipCamera" class="lc-round" type="button" aria-label="前後カメラを切り替え" title="前後カメラを切り替え" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg></button>
        <button id="stopCamera" class="lc-round" type="button" aria-label="カメラを一時停止" title="一時停止" disabled><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="6" width="3.5" height="12" rx="1"/><rect x="13.5" y="6" width="3.5" height="12" rx="1"/></svg></button>
      </div>
    </header>

    <div class="lc-bottom">
      <div class="lc-feedback">
        <p id="stageMsg" class="lc-toast pc-sr-only" role="status" aria-live="polite" hidden></p>
        <p id="info" class="pc-sr-only">写真はこの端末で処理します。</p>
        <span class="pc-sr-only"><span id="cameraStatus">準備中</span><span id="frameDimensions"></span></span>
      </div>
      <!-- Look presets: one tap changes the whole palette -->
      <div class="lc-looks" id="looks" role="radiogroup" aria-label="色の雰囲気">
        <button type="button" role="radio" data-look="gb" aria-checked="true"><i class="lc-sw" style="--a:#e0f8d0;--b:#a8c070;--c:#587830;--d:#203810"></i><span>GB</span></button>
        <button type="button" role="radio" data-look="mono" aria-checked="false"><i class="lc-sw" style="--a:#fff;--b:#fff;--c:#000;--d:#000"></i><span>白黒</span></button>
        <button type="button" role="radio" data-look="gray" aria-checked="false"><i class="lc-sw" style="--a:#eee;--b:#aaa;--c:#666;--d:#222"></i><span>グレー</span></button>
        <button type="button" role="radio" data-look="c8" aria-checked="false"><i class="lc-sw" style="--a:#f4d35e;--b:#ee964b;--c:#0d3b66;--d:#2a2a2a"></i><span>8色</span></button>
        <button type="button" role="radio" data-look="c16" aria-checked="false"><i class="lc-sw" style="--a:#f7c59f;--b:#ef6f6c;--c:#2a9d8f;--d:#264653"></i><span>16色</span></button>
        <button type="button" role="radio" data-look="photo" aria-checked="false"><i class="lc-sw lc-sw-photo"></i><span>写真の色</span></button>
        <button type="button" role="radio" data-look="c256" aria-checked="false"><i class="lc-sw lc-sw-rainbow"></i><span>256色</span></button>
        <button type="button" role="radio" data-look="full" aria-checked="false"><i class="lc-sw lc-sw-full"></i><span>フル</span></button>
      </div>
      <div class="lc-bottom-row">
        <button id="imageSettings" class="lc-pill" type="button" popovertarget="sizePopover" aria-controls="sizePopover" aria-label="撮影と色の設定">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          <span id="colorSummary">4色</span><span class="lc-dot" aria-hidden="true">·</span><span id="sizeSummary">256 px</span><span class="pc-sr-only" id="ratioSummary">画面</span>
        </button>
        <div id="resultControls" class="lc-result" hidden>
          <a id="savePng" class="lc-save" aria-disabled="true" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 19h14"/></svg><span>PNGを保存</span></a>
        </div>
      </div>
    </div>

    <!-- Settings: a bottom sheet on phones, a floating panel on wide screens -->
    <div class="lc-sheet" id="sizePopover" popover aria-labelledby="sizeTitle">
      <div class="lc-sheet-grip" aria-hidden="true"></div>
      <header class="lc-sheet-head">
        <h2 id="sizeTitle">仕上がり</h2>
        <button class="lc-sheet-close" type="button" popovertarget="sizePopover" popovertargetaction="hide" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>

      <section class="lc-group" aria-labelledby="gFrame">
        <h3 id="gFrame">フレーム</h3>
        <div class="lc-field"><span class="lc-label">縦横比</span>
          <div class="lc-seg" role="radiogroup" aria-label="縦横比">
            <label><input type="radio" name="aspect" value="screen" checked><span>画面</span></label>
            <label><input type="radio" name="aspect" value="1:1"><span>1:1</span></label>
            <label><input type="radio" name="aspect" value="3:4"><span>3:4</span></label>
            <label><input type="radio" name="aspect" value="9:16"><span>9:16</span></label>
            <label><input type="radio" name="aspect" value="4:3"><span>4:3</span></label>
            <label><input type="radio" name="aspect" value="16:9"><span>16:9</span></label>
          </div>
        </div>
        <div class="lc-field"><span class="lc-label">ドット数 <small>長い辺</small></span>
          <div class="lc-seg" role="radiogroup" aria-label="ドット数">
            <label><input type="radio" name="pixels" value="32"><span>32</span></label>
            <label><input type="radio" name="pixels" value="64"><span>64</span></label>
            <label><input type="radio" name="pixels" value="96"><span>96</span></label>
            <label><input type="radio" name="pixels" value="128"><span>128</span></label>
            <label><input type="radio" name="pixels" value="160"><span>160</span></label>
            <label><input type="radio" name="pixels" value="256" checked><span>256</span></label>
          </div>
        </div>
      </section>

      <section class="lc-group" aria-labelledby="gColor">
        <h3 id="gColor">色</h3>
        <div class="lc-field" id="paletteModeRow"><span class="lc-label">配色の選び方</span>
          <div class="lc-seg" role="radiogroup" aria-label="配色の選び方">
            <label><input type="radio" name="paletteMode" value="gameboy" checked><span>おまかせ</span></label>
            <label><input type="radio" name="paletteMode" value="source"><span>写真の色</span></label>
          </div>
        </div>
        <div class="lc-palette"><div id="palettePreview" class="lc-palette-colors" aria-label="現在の配色"></div><button type="button" class="lc-link" id="repick">色を選び直す</button></div>
      </section>

      <section class="lc-group" aria-labelledby="gFinish">
        <h3 id="gFinish">仕上げ</h3>
        <label class="lc-switch"><span><strong>ディザ</strong><small>点の模様でグラデーションを表現。8色・16色ではざらつきを自動で整えます</small></span><input type="checkbox" name="dither" role="switch" checked></label>
      </section>

      <details class="lc-group lc-tone">
        <summary><h3>カメラの色調整</h3><span class="lc-tone-state" id="toneState">標準</span></summary>
        <label class="lc-range"><span class="lc-label">明るさ <output data-for="brightness">0</output></span><input name="brightness" type="range" min="-100" max="100" step="1" value="0"></label>
        <label class="lc-range"><span class="lc-label">露出 <output data-for="exposure">0</output></span><input name="exposure" type="range" min="-100" max="100" step="1" value="0"></label>
        <label class="lc-range"><span class="lc-label">コントラスト <output data-for="contrast">0</output></span><input name="contrast" type="range" min="-100" max="100" step="1" value="0"></label>
        <label class="lc-range"><span class="lc-label">彩度 <output data-for="saturation">0</output></span><input name="saturation" type="range" min="-100" max="100" step="1" value="0"></label>
        <label class="lc-range"><span class="lc-label">影 <output data-for="shadows">0</output></span><input name="shadows" type="range" min="-100" max="100" step="1" value="0"></label>
        <label class="lc-range"><span class="lc-label">色温度 <output data-for="whiteBalance">0</output></span><input name="whiteBalance" type="range" min="-100" max="100" step="1" value="0"><span class="lc-range-ends"><span>青み</span><span>暖かみ</span></span></label>
        <button id="resetCamera" class="lc-link" type="button">色調整をリセット</button>
      </details>

      <footer class="lc-sheet-foot">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>写真は端末内で処理します</span>
        <output id="outputSummary" aria-live="polite">PNG</output>
      </footer>
    </div>
  </main>
  <nav class="app-tabs pc-nav" aria-label="アプリナビゲーション" data-nav="five">
    <a data-nav="home" href="/home/" aria-label="ホーム"><img src="/assets/icons/pixieed/home.svg" alt=""></a>
    <a data-nav="map" href="/" aria-label="地図"><img src="/assets/icons/pixieed/globe.svg" alt=""></a>
    <button id="capture" class="pc-nav-action" data-action="capture" type="button" aria-label="表示中の画像を撮影" title="撮影" disabled>
      <span class="pc-nav-shutter" aria-hidden="true"></span>
      <img class="pc-nav-resume" src="/assets/icons/pixieed/camera.svg" alt="">
      <img class="pc-nav-retake" src="/assets/icons/pixieed/reset.svg" alt="">
    </button>
    <a data-nav="tools" href="/tools/" aria-label="ツール" aria-current="page"><img src="/assets/icons/pixieed/celestial.svg" alt=""></a>
    <a data-nav="profile" href="/profile/" aria-label="マイページ"><img src="/assets/icons/pixieed/profile.svg" alt=""></a>
  </nav>
  <script type="module" src="js/pixel-lens/app.mjs?v=20260926-ux-1"></script>
</body>
</html>
