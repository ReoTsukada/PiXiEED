<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>PiXiEED</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    const params = new URLSearchParams(window.location.search || "");
    const target = params.has("localHidden")
      ? "/play/hidden-object/"
      : ["postPuzzle", "localSpot", "puzzle"].some((key) => params.has(key)) || window.location.hash.startsWith("#puzzle=")
        ? "/play/spot-difference/"
        : "/tools/";
    window.location.replace(target === "/tools/" ? target : target + window.location.search + window.location.hash);
  </script>
  <meta name="theme-color" content="#f4f2ec">
  <link rel="stylesheet" href="/css/pixieed-design-system.css?rev=20261001-free-tools-1">
  <link rel="stylesheet" href="/css/site.css?rev=20261001-text-contrast-1">
  <link rel="stylesheet" href="/css/creation-pixfind.css?rev=20261002-header-layout-1">
  <link rel="stylesheet" href="/css/site-header.css?rev=20261002-header-layout-1">
  <link rel="stylesheet" href="/css/arcade.css?rev=20260929-claude-integration-1">
  <link rel="stylesheet" href="/css/arcade-tools.css?rev=20260929-claude-integration-1">
</head>
<body data-page="pixfind" class="app-page app-page--tool-pixfind pixfind-tool-body">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/" aria-label="PiXiEED ホーム"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a></div></header>
  <main id="main" class="pixfind-page">
    <header class="pixfind-heading"><p class="pixfind-eyebrow">PiXFiND</p><h1>絵の中のちがいや探しものを見つけよう</h1><p>公開されている問題を選んで遊べます。</p></header>
    <p id="pixfind-status" class="pixfind-status" role="status" aria-live="polite">公開問題を読み込んでいます。</p>
    <p id="pixfind-local-only" class="pixfind-status" role="status" hidden>端末内の試遊です。この問題は公開されていません。</p>
    <section id="pixfind-list" class="pixfind-list" aria-label="公開中の問題"></section>
    <section id="pixfind-game" class="pixfind-game" hidden aria-labelledby="pixfind-title">
      <div class="pixfind-game__heading"><button id="pixfind-back" class="pixfind-back" type="button" aria-label="問題一覧へ戻る">‹</button><div class="pixfind-game__identity"><h2 id="pixfind-title"></h2><p id="pixfind-author"></p></div><p id="pixfind-progress" class="pixfind-progress" aria-live="polite"></p></div>
      <p id="pixfind-game-status" class="pixfind-game-status" role="status" aria-live="polite"></p>
      <div class="pixfind-images"><figure class="pixfind-image"><figcaption><span id="pixfind-image-label">絵をタップ</span><button id="pixfind-compare" class="pixfind-compare" type="button" aria-pressed="false" hidden>変化後を見る</button><button id="pixfind-hint" class="pixfind-hint px-perk" type="button" aria-label="ヒント（特典）" title="ヒント" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button></figcaption><div id="pixfind-play-area" class="pixfind-play-area" role="application" aria-label="絵を調べる場所" tabindex="0"><img id="pixfind-original" alt="問題の絵" draggable="false"><img id="pixfind-changed" alt="変化後の絵" draggable="false" hidden><canvas id="pixfind-overlay" aria-hidden="true"></canvas></div></figure></div>
      <ol id="pixfind-found-list" class="pixfind-found-list" aria-label="見つけた場所"></ol>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><p>PiXiEED</p></div></footer>
  <nav class="app-tabs" aria-label="アプリナビゲーション"><a data-nav="map" href="/globe/" aria-label="地球儀"><img src="/assets/icons/pixieed/globe.svg" alt=""></a><a data-nav="camera" href="/pixel-camera.html" aria-label="撮影"><img src="/assets/icons/pixieed/shoot.svg" alt=""></a><button id="pixfind-primary" type="button" aria-label="選択した問題を遊ぶ"><span aria-hidden="true">▶</span></button><a data-nav="tools" href="/tools/" aria-label="ツール"><img src="/assets/icons/pixieed/tools.svg" alt=""></a><a data-nav="profile" href="/profile/" aria-label="マイページ"><img src="/assets/icons/pixieed/profile.svg" alt=""></a></nav>
  <script type="module" src="/js/creation/pixfind-play.mjs?rev=20261001-free-tools-1"></script>
  <script type="module" src="/js/arcade-dress.mjs?rev=20260929-claude-integration-1"></script>
  <script type="module" src="/js/site-header.mjs?rev=20261002-header-layout-1"></script>
</body>
</html>
