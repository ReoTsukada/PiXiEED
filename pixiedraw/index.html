<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0;url=../pixiedraw2/">
  <title>iDRAW Studioへ移動</title>
  <script>
    (() => {
      const target = new URL('../pixiedraw2/', window.location.href);
      const source = new URLSearchParams(window.location.search);
      const safeToken = /^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$/;
      for (const key of ['project', 'market_import']) {
        const value = source.get(key);
        if (value && safeToken.test(value)) target.searchParams.set(key, value);
      }
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>iDRAW Studioへ移動しています。</p>
  <p><a href="../pixiedraw2/">iDRAW Studioを開く</a></p>
</body>
</html>
