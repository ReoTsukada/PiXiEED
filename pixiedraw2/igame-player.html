<!DOCTYPE html>
<html lang="ja" data-igame-entry="player" data-feature-flag="on">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>iGAME Player Runtime | PiXiEED</title>
    <link rel="stylesheet" href="./assets/igame-player.css?v=20260911-igame-public-player-v1">
  </head>
  <body>
    <main
      id="igamePlayerApp"
      class="igame-player"
      tabindex="0"
      aria-labelledby="igameStartTitle"
      data-igame-surface="runtime-shell"
    >
      <section
        id="igameBrandSplash"
        class="igame-player__splash"
        aria-label="PiXiEED"
      >
        <img
          class="igame-player__splash-logo"
          src="./assets/brand/pixieed-logo-retina.png"
          width="96"
          height="96"
          alt="PiXiEED"
          decoding="async"
        >
        <strong>PiXiEED</strong>
      </section>

      <section
        id="igameStartScreen"
        class="igame-player__start"
        aria-labelledby="igameStartTitle"
        hidden
      >
        <img
          class="igame-player__start-logo"
          src="./assets/brand/pixieed-logo-48.png"
          width="48"
          height="48"
          alt="PiXiEED"
          decoding="async"
        >
        <p class="igame-player__eyebrow">PiXiEED / iGAME</p>
        <h1 id="igameStartTitle">Gameを開始</h1>
        <p id="igameStartSubtitle" class="igame-player__subtitle">
          ユーザーが作成したGame Runtimeを準備しています。
        </p>
        <p
          id="igameAccessStatus"
          class="igame-player__access-status"
          role="status"
          aria-live="polite"
        >
          Runtimeを確認しています。
        </p>
        <button
          id="igameStartButton"
          class="igame-button igame-button--primary"
          type="button"
          disabled
        >
          START
        </button>
        <p class="igame-player__note">
          この画面の次に表示されるゲーム画面は、公開されたGame設定とRuntimeから復元されます。
        </p>
      </section>

      <section
        id="igameRuntimeScreen"
        class="igame-player__runtime"
        aria-label="ユーザーGameのRuntime画面"
        hidden
      >
        <div
          id="igameRuntimeMount"
          class="igame-player__runtime-mount"
          data-igame-runtime-owned="user-game"
        ></div>
        <p
          id="igameRuntimeStatus"
          class="igame-player__runtime-status"
          role="status"
          aria-live="polite"
        ></p>
      </section>

      <p id="igamePlayerError" class="igame-player__error" role="alert" hidden></p>
    </main>
    <script src="../scripts/pixieed-account-supabase-client.js"></script>
    <script type="module" src="./dist/igame-player.js?v=20260911-igame-public-player-v1"></script>
  </body>
</html>
