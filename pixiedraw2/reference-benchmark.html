<!doctype html>
<html lang="ja" data-pixieed-entry="draw2-reference-benchmark" data-feature-flag="off">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>PiXiEEDstudio iDRAW — Reference Performance Checkpoint</title>
    <link rel="stylesheet" href="./assets/draw2-shell.css">
    <style>
      .reference-benchmark-shell { width: min(1180px, 100%); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom)); }
      .reference-benchmark-card { background: var(--draw2-surface); border: 1px solid var(--draw2-border); border-radius: 18px; padding: 20px; margin-top: 20px; }
      .reference-benchmark-button { min-height: 44px; border: 0; border-radius: 10px; padding: 0 16px; background: var(--draw2-accent); color: #0c2422; font-weight: 800; cursor: pointer; }
      .reference-benchmark-button:disabled { opacity: .55; cursor: wait; }
      #referenceOutput { max-height: 60vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--draw2-muted); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .reference-benchmark-canvas { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <main class="reference-benchmark-shell" aria-labelledby="referenceTitle">
      <header class="draw2-header">
        <div>
          <p class="draw2-eyebrow">ISOLATED / LOCAL ONLY / MEASUREMENT</p>
          <h1 id="referenceTitle">Reference Performance Checkpoint</h1>
          <p class="draw2-description">WP-100 Coreの1 pixel、COW、Sparse、Determinism、Tile比較、Browser Canvas Pathを計測します。</p>
        </div>
        <span class="draw2-badge">Feature Flag OFF</span>
      </header>
      <section class="reference-benchmark-card" aria-labelledby="referenceRunHeading">
        <h2 id="referenceRunHeading">WP-110 preflight</h2>
        <p id="referenceStatus" class="draw2-status" role="status" aria-live="polite">未計測</p>
        <button id="runReferenceCheckpoint" class="reference-benchmark-button" type="button">Run Reference Checkpoint</button>
        <p class="draw2-help">実ブラウザ上の計測値を記録します。実機モデル不明、実Mobile未接続、正式p95 GateはUNTESTEDとして扱います。</p>
      </section>
      <section class="reference-benchmark-card" aria-labelledby="referenceOutputHeading">
        <h2 id="referenceOutputHeading">Raw result</h2>
        <pre id="referenceOutput">Runを押すと結果が表示されます。</pre>
      </section>
      <canvas id="referenceCanvas512" class="reference-benchmark-canvas" width="512" height="512" aria-hidden="true"></canvas>
      <canvas id="referenceCanvas256" class="reference-benchmark-canvas" width="256" height="256" aria-hidden="true"></canvas>
    </main>
    <script type="module" src="./dist/draw2-reference-benchmark-entry.js"></script>
  </body>
</html>
