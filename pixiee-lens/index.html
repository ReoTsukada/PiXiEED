<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0b1224">
  <title>PiXiEELENSの移行案内｜PiXiEED</title>
  <meta name="description" content="旧PiXiEELENSの保存データを保護しながら、新しいカメラモードへご案内します。">
  <link rel="canonical" href="https://pixieed.jp/camera/">
  <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1224; color: #f5f7ff; }
    body { box-sizing: border-box; min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(100%, 34rem); padding: 24px; border: 1px solid #53617d; border-radius: 16px; background: #151f35; }
    h1 { margin-top: 0; font-size: 1.35rem; }
    p { line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    a { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 10px 16px; border-radius: 10px; color: #08101f; background: #bde8ff; font-weight: 700; text-decoration: none; }
    a.secondary { color: #f5f7ff; background: #34415d; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>PiXiEELENSは新しいカメラモードに移行しました</h1>
    <p data-legacy-entry-status role="status" aria-live="polite">現在のカメラモードへ移動します。移行できない保存データがある場合は、この案内から確認できます。</p>
    <p data-legacy-output-note hidden>以前の撮影データは端末内の出力に保存されています。データを確認してから、必要なファイルをダウンロードしてください。</p>
    <p data-legacy-transfer-note hidden>旧PiXiEELENSからの転送データがこの端末に残っています。自動では読み込まず、そのまま保持しています。</p>
    <p data-legacy-state-note hidden>この旧URLには以前の状態や未対応のパラメーターがあります。元のURLと端末内データは変更していません。</p>
    <div class="actions">
      <a data-legacy-camera-link href="/camera/">新しいカメラモードを開く</a>
      <a data-legacy-output-link class="secondary" href="/output/work/" hidden>保存した撮影データを確認</a>
      <a data-legacy-transfer-download class="secondary" href="#" download hidden>残っている画像データをダウンロード</a>
    </div>
    <noscript><p>JavaScriptが無効です。<a href="/camera/">新しいカメラモード</a>を開いてください。</p></noscript>
  </main>
  <script type="module" src="/js/creation/legacy-lens-entry.mjs?rev=20261017-entry-integration-1"></script>
</body>
</html>
