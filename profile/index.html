<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/css/site.css?rev=20261019-site-gothic-1">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<meta name="robots" content="noindex,follow">

</head>
<body data-page="profile" data-page-gutters="content" class="app-page">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/" aria-label="PiXiEED ホーム"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a><nav class="site-nav" aria-label="メインナビゲーション"></nav></div></header>
  <nav class="mobile-nav" aria-label="アプリナビゲーション"></nav>
  <main id="main">
    <section class="section profile-workspace">
      <div class="container" data-profile-root>
        <noscript>自分のページを表示するにはJavaScriptを有効にしてください。</noscript>
      </div>
      <div class="container profile-utilities">
        <nav class="profile-social-shortcuts" aria-label="投稿と下書き">
          <a class="profile-shortcut" href="/feed/?view=saved"><span class="profile-icon profile-icon--bookmark" aria-hidden="true"></span><span>保存した投稿</span><span class="profile-icon profile-icon--forward" aria-hidden="true"></span></a>
          <a class="profile-shortcut" href="/feed/?view=drafts"><span class="profile-icon profile-icon--draw" aria-hidden="true"></span><span>投稿の下書き</span><span class="profile-icon profile-icon--forward" aria-hidden="true"></span></a>
        </nav>
        <details class="profile-disclosure profile-sharing" id="profile-sharing">
          <summary><span class="profile-icon profile-icon--home" aria-hidden="true"></span><strong>ホームへの作品掲載</strong><span class="profile-disclosure__hint">設定</span></summary>
          <section class="profile-disclosure__body" data-home-artwork-settings aria-label="ホームへの作品掲載"></section>
        </details>
        <details class="profile-disclosure profile-device" id="profile-device">
          <summary><span class="profile-icon profile-icon--device" aria-hidden="true"></span><strong>この端末の作品</strong><span class="profile-disclosure__hint">管理</span></summary>
          <div class="profile-disclosure__body">
            <p>ログインしても、このブラウザーに保存した作品は消えません。関連付けても公開やクラウドへの送信は行いません。</p>
            <a class="profile-device__open" href="/tools/"><span class="profile-icon profile-icon--artwork" aria-hidden="true"></span>制作ツールで保存作品を開く<span class="profile-icon profile-icon--forward" aria-hidden="true"></span></a>
            <button type="button" class="button button--quiet" data-local-work-summary>端末内作品の関連付けを確認</button>
            <p data-local-work-status role="status" aria-live="polite">作品本体は各ツールの「作品を管理」から開けます。別端末への同期は行いません。</p>
            <p class="profile-note">ゲスト投稿はこの端末のセッションから管理できます。見つけた記録と表示設定はこの端末に保存されます。</p>
          </div>
        </details>
      </div>
      <div id="legacy-placement-root" class="legacy-placement" hidden></div>
    </section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><div><a class="brand" href="/" aria-label="PiXiEED ホーム"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a><p>街角で、絵に会おう。</p></div><nav class="footer-links" aria-label="補助リンク"></nav></div></footer>

  <script type="module" src="/js/creation/home-artwork-settings.mjs?rev=20261112-home-review-1"></script>
</body>
