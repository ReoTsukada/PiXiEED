    <h1>ドット絵のゲームで遊ぼう</h1>
    <p class="lead">絵の中の違いを見つける「間違い探し」と、指定されたものを見つける「もの探し」。遊びたいゲームを選んでください。</p>
    <p class="legacy-entry__status" data-legacy-entry-status role="status" aria-live="polite">2つのゲームから選べます。</p>
    <nav class="legacy-entry__games" aria-label="ゲームを選ぶ">
      <a class="legacy-entry__game" data-legacy-game="spot-difference" href="/play/spot-difference/">

        <span><strong>間違い探し</strong><small>2枚のドット絵を見比べて、違うところを見つけます。</small></span>
        <span class="legacy-entry__arrow" aria-hidden="true">→</span>
      </a>
      <a class="legacy-entry__game" data-legacy-game="hidden-object" href="/play/hidden-object/">
        <span class="legacy-entry__game-icon" aria-hidden="true"><img src="/assets/icons/pixieed/hidden-object.svg" width="40" height="40" alt=""></span>
        <span><strong>もの探し</strong><small>ドット絵の中から、指定されたものを探します。</small></span>
        <span class="legacy-entry__arrow" aria-hidden="true">→</span>
      </a>
    </nav>
