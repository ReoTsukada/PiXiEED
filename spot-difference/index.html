<body data-tool-name="かんたん間違い探し" data-tool-short="間違い探し" data-page="spot-difference" class="app-page app-page--tool-spot-difference">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/" aria-label="PiXiEED ホーム"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a></div></header>
  <main id="main" class="spot-page">
    <header class="spot-heading"><h1>かんたん間違い探し</h1><p>保存した絵の版を比べ、正解の場所を選ぼう。</p></header>
    <a class="puzzle-list-back" href="/play/spot-difference/">‹ みんなの一覧へ</a>
    <p id="spot-status" class="spot-status" role="status" aria-live="polite">自分の端末に保存した絵を選んでください。</p>
    <section id="spot-setup" class="spot-setup" aria-label="比べる絵を選ぶ">
      <div id="spot-shelf" hidden></div>
      <label>元にする保存版<select id="spot-before" aria-label="元にする保存版"></select></label>
      <label>変更後の保存版<select id="spot-after" aria-label="変更後の保存版"></select></label>
      <button id="spot-start" type="button" disabled>差分候補を見つける</button>
      <button id="spot-resume" type="button" hidden>前回の作成を再開</button>
      <p>間違い探しは自分の絵を持ちます。ほかのツールの絵を持ってくると、ここに新しい版として写されます（元の絵は変わりません）。変えた絵をもう一度持ってくれば、2つの版を比べられます。</p>
    </section>
    <section id="spot-editor" class="spot-editor" hidden aria-label="差分候補を確認">
      <figure class="spot-preview"><figcaption>変更後の絵。色のついた場所をタップして候補を選びます。分割モードでは画素をなぞって範囲を選べます。</figcaption><canvas id="spot-canvas" aria-label="変更後の画像。色のついた候補をタップして選び、分割モードではなぞって範囲を選択できます。ピンチで拡大。矢印キーで候補を選択" tabindex="0"></canvas></figure>
      <p id="spot-source-label" class="spot-source-label"></p>
      <details class="spot-settings">
        <summary aria-label="候補と編集操作を開く">候補・編集</summary>
        <div class="spot-settings__sheet">
          <p id="spot-edit-help" class="spot-edit-help">絵をタップすると候補を選択。分割は「分割する」をオンにして画素をなぞります。</p>
          <button id="spot-split-mode" class="spot-split-mode" type="button" aria-pressed="false">分割する</button>
          <div class="spot-actions" aria-label="候補の編集">
            <button id="spot-merge" type="button" disabled>まとめる</button>
            <button id="spot-split" type="button" disabled>選択範囲で分割</button>
            <button id="spot-exclude" type="button" disabled>候補を除外</button>
            <button id="spot-confirm" type="button" disabled>正解を確定</button>
          </div>
          <ol id="spot-candidates" class="spot-candidates" aria-label="差分候補"></ol>
          <p id="spot-confirmed" class="spot-confirmed" role="status" hidden>作者が正解を確定しました。作品は端末内の下書きです。</p>
          <a class="puzzle-editor-play" href="/play/spot-difference/">みんなの一覧へ</a>
        </div>
      </details>
      <div class="spot-publish-actions" aria-label="確定した間違い探しの操作">
        <button id="spot-play-local" type="button" hidden disabled>確定した下書きを試しに遊ぶ</button>
        <button id="spot-publish" class="spot-publish" type="button" hidden disabled>地球儀へ投稿</button>
      </div>
      <output id="spot-zoom" class="spot-zoom" aria-label="画像の拡大率">100%</output>
      <p id="spot-edit-hint" class="spot-edit-hint" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><p>PiXiEED</p></div></footer>
