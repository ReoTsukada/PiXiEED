<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出力画面のブラウザ確認</title>
  <style>body{font:16px system-ui;max-width:680px;margin:30px auto;padding:0 18px}button{display:block;width:100%;min-height:52px;margin:12px 0;padding:12px;text-align:left}#state{padding:12px;background:#eef3ef}</style>
</head>
<body>
  <h1>出力画面のブラウザ確認</h1>
  <p>テスト用の一時ファイルだけを同じブラウザー内に作ります。</p>
  <div id="controls"></div>
  <p id="state" role="status">形式を選んでください。</p>
  <script type="module">
    import { sendToolOutput } from '/js/creation/output-handoff.mjs?rev=20261008-output-10';
    import { encodeAnimatedGif } from '/js/animated-export.mjs';
    import { encodeCameraPng } from '/js/pixel-studio/png-export.mjs';
    import { createAudioSong } from '/js/creation/audio-core.mjs?rev=20261005-audio-noise-1';
    import { encodeOutput } from '/js/creation/output-encoders.mjs?rev=20261008-output-6';
    import { createPixelLensOutputOptions } from '/js/pixel-lens/output-handoff.mjs?rev=20261008-pixel-lens-output-2';
    const controls = document.querySelector('#controls');
    const state = document.querySelector('#state');
    function add(label, run) {
      const button = document.createElement('button');
      button.type = 'button'; button.textContent = label;
      button.addEventListener('click', async () => {
        button.disabled = true; state.textContent = '端末内に一時データを準備しています…';
        try { await run(); } catch (error) { state.textContent = error?.message || '準備に失敗しました。'; button.disabled = false; }
      });
      controls.append(button);
    }
    async function open(blob, filename, title, metadata = {}, mediaSource = null, route = {}) {
      const result = await sendToolOutput({ blob, filename, returnUrl: route.returnUrl || '/draw/', returnOutputId: route.returnOutputId === true, source: route.source || 'テスト用サンプル', title, metadata, ...(mediaSource ? { mediaSource } : {}), ...(route.mediaSources ? { mediaSources: route.mediaSources } : {}) });
      if (!result.ok) throw result.error || new Error('出力画面を開けませんでした。');
    }
    async function encodeCanvasFrame(frame, mime, quality) {
      const canvas = document.createElement('canvas'); canvas.width = frame.width; canvas.height = frame.height;
      const context = canvas.getContext('2d'); context.putImageData(new ImageData(new Uint8ClampedArray(frame.data), frame.width, frame.height), 0, 0);
      try { return await new Promise((resolve, reject) => canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error(`${mime}を作成できません。`)), mime, mime === 'image/jpeg' ? quality : undefined)); }
      finally { canvas.width = canvas.height = 1; }
    }
    async function decodePixels(blob) {
      const url = URL.createObjectURL(blob); const image = new Image(); image.src = url;
      try {
        await image.decode(); const canvas = document.createElement('canvas'); canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
        const context = canvas.getContext('2d', { willReadFrequently: true }); context.drawImage(image, 0, 0);
        const result = { width: canvas.width, height: canvas.height, data: context.getImageData(0, 0, canvas.width, canvas.height).data };
        canvas.width = canvas.height = 1; return result;
      } finally { URL.revokeObjectURL(url); }
    }
    add('JPEG・SVG・APNGを実デコード確認', async () => {
      const vector = { width: 2, height: 2, data: new Uint8Array([250, 20, 40, 255, 0, 0, 0, 0, 10, 220, 60, 128, 0, 90, 240, 255]) };
      const svg = await encodeOutput({ format: 'svg', frames: [vector] }); const svgDecoded = await decodePixels(svg);
      const svgMismatches = [...svgDecoded.data].flatMap((value, index) => (index % 4 === 3 ? Math.abs(value - vector.data[index]) <= 1 : vector.data[index + 3] === 0 ? true : Math.abs(value - vector.data[index]) <= 1) ? [] : [`${index}:${vector.data[index]}→${value}`]);
      if (svg.type !== 'image/svg+xml' || svgDecoded.width !== 2 || svgDecoded.height !== 2 || svgMismatches.length) throw new Error(`SVG実デコード不一致 · ${svgDecoded.width}×${svgDecoded.height} · ${svgMismatches.slice(0, 6).join(',')}`);
      const jpgFrame = { width: 64, height: 64, data: new Uint8Array(64 * 64 * 4) };
      let seed = 7331;
      for (let index = 0; index < 64 * 64; index += 1) {
        seed = (seed * 48271) % 2147483647;
        jpgFrame.data.set([seed & 255, seed >>> 8 & 255, seed >>> 16 & 255, 255], index * 4);
      }
      const matte = { width: 8, height: 8, data: new Uint8Array(8 * 8 * 4) };
      const jpegBlack = await encodeOutput({ format: 'jpeg', frames: [matte], background: '#000000', quality: 0.92 }, { encodeRaster: encodeCanvasFrame });
      const jpegWhite = await encodeOutput({ format: 'jpeg', frames: [matte], background: '#ffffff', quality: 0.92 }, { encodeRaster: encodeCanvasFrame });
      const jpegLow = await encodeOutput({ format: 'jpeg', frames: [jpgFrame], background: '#ffffff', quality: 0.5 }, { encodeRaster: encodeCanvasFrame });
      const jpegHigh = await encodeOutput({ format: 'jpeg', frames: [jpgFrame], background: '#ffffff', quality: 0.95 }, { encodeRaster: encodeCanvasFrame });
      const blackPixel = (await decodePixels(jpegBlack)).data; const whitePixel = (await decodePixels(jpegWhite)).data;
      await decodePixels(jpegLow); await decodePixels(jpegHigh);
      if ([jpegBlack, jpegWhite, jpegLow, jpegHigh].some((blob) => blob.type !== 'image/jpeg') || blackPixel[0] > 10 || whitePixel[0] < 245 || jpegHigh.size <= jpegLow.size) throw new Error(`JPEG確認失敗 · 黒=${blackPixel[0]} 白=${whitePixel[0]} · 画質50% ${jpegLow.size}B/95% ${jpegHigh.size}B`);
      const animated = [0, 1].map((variant) => ({ ...vector, data: variant ? new Uint8Array(vector.data.map((value, index) => index % 4 === 0 ? 255 - value : value)) : vector.data, delayMs: variant ? 170 : 40 }));
      const apng = await encodeOutput({ format: 'apng', frames: animated, loopCount: 4 }, { encodeRaster: encodeCanvasFrame });
      const apngDecoded = await decodePixels(apng);
      if (apng.type !== 'image/apng' || apngDecoded.width !== 2 || apngDecoded.height !== 2) throw new Error('APNGの実デコード確認に失敗しました。');
      state.textContent = `実デコード成功 · SVG 2×2 px 画素一致(±1) · JPEG背景黒=${blackPixel[0]}/白=${whitePixel[0]}、画質50% ${jpegLow.size}B / 95% ${jpegHigh.size}B · APNG 2×2 px 2フレーム`;
    });
    add('透明背景つき PNG を開く', async () => {
      const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 16;
      const context = canvas.getContext('2d'); context.fillStyle = '#ef5264'; context.fillRect(0, 0, 12, 16); context.fillStyle = '#16a878'; context.fillRect(20, 0, 12, 16);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      await open(blob, 'sample-pixel.png', 'PNG を確認', { width: 32, height: 16 });
    });
    add('GIF を開く', async () => {
      const frames = [0, 1].map(red => ({ width: 2, height: 2, data: new Uint8ClampedArray([red * 255, 20, 20, 255, 0, 180, 80, 255, 0, 80, 240, 255, 250, 220, 40, 255]) }));
      frames.forEach((frame) => { frame.delayMs = 250; });
      const result = await encodeAnimatedGif(frames, { longEdge: 32, workerFactory: () => null });
      await open(new Blob([result.bytes], { type: 'image/gif' }), 'sample-animation.gif', 'GIF を確認', { width: 2, height: 2, defaultScale: result.scale, durationSeconds: 0.5, frameCount: frames.length }, { kind: 'gif-frames', frames, loopCount: 0 });
    });
    add('WAV を開く', async () => {
      const rate = 8000, samples = 8000, bytes = new ArrayBuffer(44 + samples * 4), view = new DataView(bytes);
      const word = (offset, value) => { for (const char of value) view.setUint8(offset++, char.charCodeAt(0)); };
      word(0, 'RIFF'); view.setUint32(4, bytes.byteLength - 8, true); word(8, 'WAVE'); word(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 2, true); view.setUint32(24, rate, true); view.setUint32(28, rate * 4, true); view.setUint16(32, 4, true); view.setUint16(34, 16, true); word(36, 'data'); view.setUint32(40, samples * 4, true);
      for (let index = 0; index < samples; index++) { view.setInt16(44 + index * 4, Math.sin(index * Math.PI * 2 * 440 / rate) * 5000, true); view.setInt16(46 + index * 4, Math.sin(index * Math.PI * 2 * 440 / rate) * 5000, true); }
      await open(new Blob([bytes], { type: 'audio/wav' }), 'sample-tone.wav', 'WAV を確認', { durationSeconds: 1, sampleRate: rate, loops: 1 });
    });
    add('音楽素材からWAV・動画を生成', async () => {
      const song = createAudioSong({ songId: 'output-browser-check', title: '出力確認', tempo: 180 });
      song.tracks[0].clips[0].notes.push({ noteId: 'output-note', pitch: 60, startTick: 0, durationTicks: 12, velocity: 96 });
      const frame = { width: 16, height: 16, data: new Uint8ClampedArray(16 * 16 * 4) };
      for (let index = 0; index < 16 * 16; index += 1) frame.data.set(index % 2 ? [240, 84, 96, 255] : [36, 112, 83, 255], index * 4);
      const canvas = document.createElement('canvas'); canvas.width = frame.width; canvas.height = frame.height;
      const context = canvas.getContext('2d'); context.putImageData(new ImageData(frame.data, frame.width, frame.height), 0, 0);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      await open(blob, 'sample-song.png', '音楽の出力を確認', { width: frame.width, height: frame.height, defaultScale: 1 }, null, {
        returnUrl: '/audio/', source: 'ドットで音楽',
        mediaSources: [
          { id: 'canvas', label: '音楽キャンバス', kind: 'rgba-frames', frames: [frame] },
          { id: 'song', label: '曲の音声', kind: 'audio-song', song },
          { id: 'video', label: '曲付き動画', kind: 'audio-video', song, image: frame }
        ]
      });
    });
    add('WebM 動画を開く', async () => {
      const response = await fetch('/assets/pixel-studio/test-media/street.webm');
      if (!response.ok) throw new Error('動画サンプルを読み込めませんでした。');
      await open(await response.blob(), 'sample-video.webm', '動画を確認', { durationSeconds: 2 });
    });
    add('ピクセルカメラから編集へ戻る', async () => {
      const data = new Uint8ClampedArray(16 * 16 * 4);
      for (let index = 0; index < 16 * 16; index += 1) data.set(index % 2 ? [240, 84, 96, 255] : [36, 112, 83, 255], index * 4);
      const exported = await encodeCameraPng({ width: 16, height: 16, data });
      await open(exported.blob, 'camera-return.png', '撮影画像を確認', { width: 16, height: 16, cameraRatio: 'screen', cameraSize: 256, cameraColors: 'full', cameraFinish: 'soft', cameraEdges: false, cameraFacing: 'environment' }, null, { returnUrl: '/pixel-camera-studio.html', returnOutputId: true, source: 'ピクセルカメラ' });
    });
    add('カメラ GIF をプレビューして編集へ戻る', async () => {
      const frames = [0, 1].map((variant) => ({ width: 4, height: 4, data: new Uint8ClampedArray(Array.from({ length: 16 }, (_, pixel) => {
        const color = (pixel + variant) % 2 ? [240, 84, 96, 255] : [36, 112, 83, 255];
        return color;
      }).flat()) }));
      frames.fps = 20;
      const exported = await encodeAnimatedGif(frames, { longEdge: 16, workerFactory: () => null });
      const options = createPixelLensOutputOptions({
        blob: new Blob([exported.bytes], { type: 'image/gif' }), filename: 'pixieed-lens-check.gif', returnUrl: '/pixel-camera.html',
        frame: frames.at(-1), gifFrames: frames, outputScale: exported.scale,
        settings: { ratio: '3:4', size: 128, colorDepth: '16', paletteMode: 'source', gradientMode: 'dither', ditherPattern: 'net8', surfaceSimplify: 55, zoom: 2, miniature: true, facing: 'environment', camera: { brightness: 4, contrast: -8 } }
      });
      const result = await sendToolOutput(options);
      if (!result.ok) throw result.error || new Error('GIFを準備できませんでした。');
    });
    add('カメラ PNG をプレビューして編集へ戻る', async () => {
      const frame = { width: 16, height: 16, data: new Uint8ClampedArray(Array.from({ length: 256 }, (_, pixel) =>
        (pixel % 2) ? [240, 84, 96, 255] : [36, 112, 83, 255]).flat()) };
      const exported = await encodeCameraPng(frame);
      const options = createPixelLensOutputOptions({
        blob: exported.blob, filename: 'pixieed-lens-check.png', returnUrl: '/pixel-camera.html', frame,
        outputScale: exported.scale,
        settings: { ratio: '1:1', size: 128, colorDepth: '16', paletteMode: 'source', gradientMode: 'none', ditherPattern: 'net8', surfaceSimplify: 55, zoom: 1, miniature: false, facing: 'environment', camera: { brightness: 0, contrast: 0 } }
      });
      const result = await sendToolOutput(options);
      if (!result.ok) throw result.error || new Error('PNGを準備できませんでした。');
    });
    add('PiXiEELENS GIF をプレビューして編集へ戻る', async () => {
      const frames = [0, 1].map((variant) => ({ width: 4, height: 4, data: new Uint8Array(Array.from({ length: 16 }, (_, pixel) =>
        (pixel + variant) % 2 ? [240, 84, 96, 255] : [36, 112, 83, 255]).flat()) }));
      frames.forEach((frame) => { frame.delayMs = 100; });
      const exported = await encodeAnimatedGif(frames, { longEdge: 16, workerFactory: () => null });
      await open(new Blob([exported.bytes], { type: 'image/gif' }), 'pixieed-lens-gif.gif', 'PiXiEELENS アニメーション',
        { width: 4, height: 4, defaultScale: exported.scale, durationSeconds: 0.2, frameCount: frames.length },
        { kind: 'gif-frames', frames, loopCount: 0 },
        { returnUrl: '/pixiee-lens/', returnOutputId: true, source: 'PiXiEELENS' });
    });
    add('PiXiEELENS PNG をプレビューして編集へ戻る', async () => {
      const frame = { width: 16, height: 16, data: new Uint8ClampedArray(Array.from({ length: 256 }, (_, pixel) =>
        pixel % 2 ? [240, 84, 96, 255] : [36, 112, 83, 255]).flat()) };
      const exported = await encodeCameraPng(frame);
      await open(exported.blob, 'pixieed-lens.png', 'PiXiEELENS 画像', { width: 16, height: 16, defaultScale: exported.scale },
        { kind: 'rgba-frames', frames: [frame] },
        { returnUrl: '/pixiee-lens/', returnOutputId: true, source: 'PiXiEELENS' });
    });
    window.addEventListener('pageshow', (event) => {
      if (!event.persisted) return;
      for (const button of controls.querySelectorAll('button')) button.disabled = false;
      state.textContent = '編集ページは保持されています。もう一度形式を選べます。';
    });
  </script>
</body>
</html>
