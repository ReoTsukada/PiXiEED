<body data-page="tools" class="app-page">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="/" aria-label="PiXiEED ホーム"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a>
    <nav class="site-nav" aria-label="メインナビゲーション"><a data-nav="home" href="/">地図</a><a data-nav="works" href="/works/">絵</a><a data-nav="stores" href="/stores/">お店</a><a data-nav="collection" href="/collection/">集めた</a><a data-nav="tools" href="/tools/">ツール</a><a class="site-nav__secondary" data-nav="shops" href="/shops/">お店の方へ</a></nav>
  </div></header>
  <nav class="mobile-nav" aria-label="アプリナビゲーション"><a data-nav="home" href="/"><span aria-hidden="true">⌖</span>地図</a><a data-nav="works" href="/works/"><span aria-hidden="true">▧</span>絵</a><a data-nav="stores" href="/stores/"><span aria-hidden="true">⌂</span>お店</a><a data-nav="collection" href="/collection/"><span aria-hidden="true">✳</span>集めた</a><a data-nav="tools" href="/tools/"><span aria-hidden="true">✦</span>ツール</a></nav>
  <main id="main">
    <section class="tool-shell">
      <div class="container">
        <div class="tool-shell__head">
          <div><span class="eyebrow">small tools</span><h1>ちょっと、つくる。</h1></div>
          <p>絵を見たり、集めたり、その先で使えるPiXiEEDの小さな道具を少しずつ増やしていきます。</p>
        </div>
        <div class="tool-grid" aria-label="PiXiEEDのツール一覧">
          <button class="tool-card tool-card--accent" type="button" data-tool-coming-soon="色をつくる"><span class="tool-card__icon" aria-hidden="true">▦</span><span><h2>色をつくる</h2><p>好きな色で、ピクセルのパレットをつくる。</p></span><span class="tool-card__status">近日公開</span></button>
          <button class="tool-card" type="button" data-tool-coming-soon="QRをつくる"><span class="tool-card__icon" aria-hidden="true">⌗</span><span><h2>QRをつくる</h2><p>あなたの絵を、街のどこかへつなぐ。</p></span><span class="tool-card__status">近日公開</span></button>
          <button class="tool-card" type="button" data-tool-coming-soon="ドットを試す"><span class="tool-card__icon" aria-hidden="true">✦</span><span><h2>ドットを試す</h2><p>小さなキャンバスで、ひと粒ずつ遊ぶ。</p></span><span class="tool-card__status">近日公開</span></button>
          <button class="tool-card" type="button" data-tool-coming-soon="作品カードをつくる"><span class="tool-card__icon" aria-hidden="true">▤</span><span><h2>作品カードをつくる</h2><p>作品と場所を紹介するカードをつくる。</p></span><span class="tool-card__status">近日公開</span></button>
          <button class="tool-card tool-card--soon" type="button" data-tool-coming-soon="マップピンをつくる"><span class="tool-card__icon" aria-hidden="true">⌖</span><span><h2>マップピンをつくる</h2><p>オリジナルのピンで、場所を飛び出す。</p></span><span class="tool-card__status">これから</span></button>
          <button class="tool-card tool-card--soon" type="button" data-tool-coming-soon="アニメをつくる"><span class="tool-card__icon" aria-hidden="true">▥</span><span><h2>アニメをつくる</h2><p>数枚の絵をつないで、動かしてみる。</p></span><span class="tool-card__status">これから</span></button>
          <button class="tool-card tool-card--soon" type="button" data-tool-coming-soon="かんたんエディタ"><span class="tool-card__icon" aria-hidden="true">✎</span><span><h2>かんたんエディタ</h2><p>思いついた景色を、すぐに形にする。</p></span><span class="tool-card__status">これから</span></button>
          <button class="tool-card tool-card--soon" type="button" data-tool-coming-soon="ARで見る"><span class="tool-card__icon" aria-hidden="true">◇</span><span><h2>ARで見る</h2><p>街の中に、絵を置いてみる。</p></span><span class="tool-card__status">これから</span></button>
        </div>
        <div class="tool-note"><span><strong>次に増える道具：</strong>作品カード作成、QR連携、ピクセルパレット</span><a class="text-link" href="/about/#contact">アイデアを送る</a></div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><div><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">P</span><span>PiXiEED</span></a><p>街角で、絵に会おう。</p></div><nav class="footer-links" aria-label="フッターナビゲーション"><a href="/">地図</a><a href="/works/">絵</a><a href="/stores/">お店</a><a href="/collection/">集めた</a><a href="/tools/">ツール</a><a href="/shops/">お店の方へ</a><a href="/about/">PiXiEEDについて</a></nav></div></footer>
